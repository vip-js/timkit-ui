<template>
  <div class="flex items-center justify-between gap-4"><div><Pagination><PaginationContent><PaginationItem><PaginationLink class="aria-disabled:pointer-events-none aria-disabled:opacity-50" href="${currentPage === 1 ? undefined : `#/page/${currentPage - 1}`}" aria-label="Go to previous page" aria-disabled="${currentPage === 1 ? true : undefined}" role="${currentPage === 1 ? 'link' : undefined}"><ChevronLeftIcon size="${16}" aria-hidden="true" /></PaginationLink></PaginationItem><!-- if showLeftEllipsis -->
<PaginationItem><PaginationEllipsis /></PaginationItem>
<!-- endif --><!-- Loop pages -->
<PaginationItem key="${page}"><PaginationLink href="${`#/page/${page}`}" isactive="${page === currentPage}">${page}</PaginationLink></PaginationItem>
<!-- End Loop --><!-- if showRightEllipsis -->
<PaginationItem><PaginationEllipsis /></PaginationItem>
<!-- endif --><PaginationItem><PaginationLink class="aria-disabled:pointer-events-none aria-disabled:opacity-50" href="${currentPage === totalPages ? undefined : `#/page/${currentPage + 1}`}" aria-label="Go to next page" aria-disabled="${currentPage === totalPages ? true : undefined}" role="${currentPage === totalPages ? 'link' : undefined}"><ChevronRightIcon size="${16}" aria-hidden="true" /></PaginationLink></PaginationItem></PaginationContent></Pagination></div><div class="flex items-center gap-3"><Label htmlfor="${id}" class="whitespace-nowrap">Go to page
        </Label><Input id="${id}" type="text" class="w-14" default-value="${String(currentPage)}" /></div></div>
</template>
