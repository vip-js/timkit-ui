<div class="timui-html-demo space-y-4 p-4">
<header class="border-b px-4 md:px-6">
    <div class="flex h-16 items-center justify-between gap-4">
      <div class="flex flex-1 items-center gap-2">
        <div data-slot="popover">
          <button type="button" data-slot="popover-trigger">
            <button type="button" data-slot="button" class="group size-8 md:hidden inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="ghost" size="icon">
              <svg
                class="pointer-events-none" width="16" height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M4 12L20 12"
                  class="origin-center -translate-y-[7px] transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-expanded:translate-x-0 group-aria-expanded:translate-y-0 group-aria-expanded:rotate-[315deg]" />
                <path
                  d="M4 12H20"
                  class="origin-center transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.8)] group-aria-expanded:rotate-45" />
                <path
                  d="M4 12H20"
                  class="origin-center translate-y-[7px] transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-expanded:translate-y-0 group-aria-expanded:rotate-[135deg]" />
              </svg>
            </button>
          </button>
          <div data-slot="popover-content" align="start">
            <nav aria-label="Main">
              <ul>
                <li>
                  <a href="#">
                    <component size="16" class="text-muted-foreground" aria-hidden="true" />
                    <span></span>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>

        <div class="flex items-center gap-6">
          <a href="#" class="text-primary hover:text-primary/90">
            <span aria-hidden="true">
          </a>
          <div class="relative">
            <input data-slot="input" class="peer h-8 ps-8 pe-2 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" placeholder="Search..." type="search">
            <div class="text-muted-foreground/80 pointer-events-none absolute inset-y-0 start-0 flex items-center justify-center ps-2 peer-disabled:opacity-50">
              <span aria-hidden="true" size="16">
            </div>
          </div>
        </div>
      </div>

      <nav aria-label="Main">
        <ul>
          <li>
            <a href="#">
              <component aria-hidden="true" />
              <span class="sr-only"></span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="flex flex-1 items-center justify-end gap-4">
        <div class="flex items-center gap-2">
          <button type="button" data-slot="button" class="text-muted-foreground relative size-8 rounded-full shadow-none inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
            size="icon"
            variant="ghost"
           
            aria-label="Open notifications">
            <span aria-hidden="true" size="16" aria-hidden="true">
            <div aria-hidden="true" class="bg-primary absolute top-0.5 right-0.5 size-1 rounded-full" />
          </button>
          <span aria-hidden="true">
        </div>
        <span aria-hidden="true">
      </div>
    </div>
  </header>
</div>
