<div class="timui-html-demo space-y-4 p-4">
<header class="border-b px-4 md:px-6">
    <div class="flex h-16 items-center justify-between gap-4">
      <div class="flex flex-1 items-center gap-2">
        <div data-slot="popover">
          <button type="button" data-slot="popover-trigger">
            <button type="button" data-slot="button" class="group size-8 md:hidden inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="ghost" size="icon">
              <svg
                class="pointer-events-none" width="16" height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M4 12L20 12"
                  class="origin-center -translate-y-[7px] transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-expanded:translate-x-0 group-aria-expanded:translate-y-0 group-aria-expanded:rotate-[315deg]" />
                <path
                  d="M4 12H20"
                  class="origin-center transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.8)] group-aria-expanded:rotate-45" />
                <path
                  d="M4 12H20"
                  class="origin-center translate-y-[7px] transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-expanded:translate-y-0 group-aria-expanded:rotate-[135deg]" />
              </svg>
            </button>
          </button>
          <div data-slot="popover-content" align="start">
            <nav aria-label="Main">
              <ul>
                <li>
                  <a href="#">
                    <component size="16" class="text-muted-foreground" aria-hidden="true" />
                    <span></span>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>

        <div class="flex items-center gap-6">
          <a href="#" class="text-primary hover:text-primary/90">
            <span aria-hidden="true">
          </a>

          <nav aria-label="Main">
            <ul>
              <div data-slot="tooltip-provider">
                <li>
                  <span data-slot="tooltip">
                    <button type="button" data-slot="tooltip-trigger">
                      <a href="#">
                        <component size="20" aria-hidden="true" />
                        <span class="sr-only"></span>
                      </a>
                    </button>
                    <span role="tooltip" data-slot="tooltip-content" side="bottom">
                      <p></p>
                    </span>
                  </span>
                </li>
              
            </ul>
          </nav>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span aria-hidden="true">

        <select data-slot="select">
          <button type="button" data-slot="select-trigger" id="language-Example"
            class="[&>svg]:text-muted-foreground/80 hover:bg-accent hover:text-accent-foreground h-8 border-none px-2 shadow-none [&>svg]:shrink-0"
            aria-label="Select language">
            <span aria-hidden="true" size="16" aria-hidden="true">
            <span data-slot="select-value"></span>
          </button>
          <div data-slot="select-content" class="[&_*[role=option]]:ps-2 [&_*[role=option]]:pe-8 [&_*[role=option]>span]:start-auto [&_*[role=option]>span]:end-2 [&_*[role=option]>span]:flex [&_*[role=option]>span]:items-center [&_*[role=option]>span]:gap-2">
            <option data-slot="select-item">
              <span class="flex items-center gap-2">
                <span class="truncate"></span>
              </span>
            </option>
          </div>
        </select>

        <span aria-hidden="true">
      </div>
    </div>
  </header>
</div>
