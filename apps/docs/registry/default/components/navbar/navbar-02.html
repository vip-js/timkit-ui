<template>
  <header class="border-b px-4 md:px-6"><div class="flex h-16 items-center justify-between gap-4"><div class="flex items-center gap-2"><Popover><PopoverTrigger aschild><Button class="group size-8 md:hidden" variant="ghost" size="icon"><svg class="pointer-events-none" width="${16}" height="${16}" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M4 12L20 12" class="origin-center -translate-y-[7px] transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-expanded:translate-x-0 group-aria-expanded:translate-y-0 group-aria-expanded:rotate-[315deg]" /><path d="M4 12H20" class="origin-center transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.8)] group-aria-expanded:rotate-45" /><path d="M4 12H20" class="origin-center translate-y-[7px] transition-all duration-300 ease-[cubic-bezier(.5,.85,.25,1.1)] group-aria-expanded:translate-y-0 group-aria-expanded:rotate-[135deg]" /></svg></Button></PopoverTrigger><PopoverContent align="start" class="w-64 p-1 md:hidden"><NavigationMenu class="max-w-none *:w-full"><NavigationMenuList class="flex-col items-start gap-0 md:gap-2"><!-- Loop navigationLinks -->
<NavigationMenuItem key="${index}" class="w-full"><!-- if link.submenu -->
<div class="text-muted-foreground px-2 py-1.5 text-xs font-medium">${link.label}</div><ul><!-- Loop link.items -->
<li key="${itemIndex}"><NavigationMenuLink href="${item.href}" class="py-1.5">${item.label}</NavigationMenuLink></li>
<!-- End Loop --></ul>
<!-- else -->
<NavigationMenuLink href="${link.href}" class="py-1.5">${link.label}</NavigationMenuLink>
<!-- endif --><!-- if index < navigationLinks.length - 1 &&
                        // Show separator if:
                        // 1. One is submenu and one is simple link OR
                        // 2. Both are submenus but with different types
                        ((!link.submenu && navigationLinks[index + 1].submenu) ||
                          (link.submenu && !navigationLinks[index + 1].submenu) ||
                          (link.submenu &&
                            navigationLinks[index + 1].submenu &&
                            link.type !== navigationLinks[index + 1].type)) -->
<div role="separator" aria-orientation="horizontal" class="bg-border -mx-1 my-1 h-px w-full" />
<!-- endif --></NavigationMenuItem>
<!-- End Loop --></NavigationMenuList></NavigationMenu></PopoverContent></Popover><div class="flex items-center gap-6"><a href="#" class="text-primary hover:text-primary/90"><Logo /></a><NavigationMenu viewport="${false}" class="max-md:hidden"><NavigationMenuList class="gap-2"><!-- Loop navigationLinks -->
<NavigationMenuItem key="${index}"><!-- if link.submenu -->
<NavigationMenuTrigger class="text-muted-foreground hover:text-primary bg-transparent px-2 py-1.5 font-medium *:[svg]:-me-0.5 *:[svg]:size-3.5">${link.label}</NavigationMenuTrigger><NavigationMenuContent class="data-[motion=from-end]:slide-in-from-right-16! data-[motion=from-start]:slide-in-from-left-16! data-[motion=to-end]:slide-out-to-right-16! data-[motion=to-start]:slide-out-to-left-16! z-50 p-1"><ul class="${cn(link.type === 'description' ? 'min-w-64' : 'min-w-48')}"><!-- Loop link.items -->
<li key="${itemIndex}"><NavigationMenuLink href="${item.href}" class="py-1.5"><!-- if link.type === 'icon' && 'icon' in item -->
<div class="flex items-center gap-2"><!-- if item.icon === 'BookOpenIcon' -->
<BookOpenIcon size="${16}" class="text-foreground opacity-60" aria-hidden="true" />
<!-- endif --><!-- if item.icon === 'LifeBuoyIcon' -->
<LifeBuoyIcon size="${16}" class="text-foreground opacity-60" aria-hidden="true" />
<!-- endif --><!-- if item.icon === 'InfoIcon' -->
<InfoIcon size="${16}" class="text-foreground opacity-60" aria-hidden="true" />
<!-- endif --><span>${item.label}</span></div>
<!-- endif --><!-- if link.type === 'description' && 'description' in item -->
<div class="space-y-1"><div class="font-medium">${item.label}</div><p class="text-muted-foreground line-clamp-2 text-xs">${item.description}</p></div>
<!-- else -->
${!link.type ||
                                    (link.type !== 'icon' && link.type !== 'description' && (
                                      <span>{item.label}</span>
                                    ))}
<!-- endif --></NavigationMenuLink></li>
<!-- End Loop --></ul></NavigationMenuContent>
<!-- else -->
<NavigationMenuLink href="${link.href}" class="text-muted-foreground hover:text-primary py-1.5 font-medium">${link.label}</NavigationMenuLink>
<!-- endif --></NavigationMenuItem>
<!-- End Loop --></NavigationMenuList></NavigationMenu></div></div><div class="flex items-center gap-2"><Button aschild variant="ghost" size="sm" class="text-sm"><a href="#">Sign In</a></Button><Button aschild size="sm" class="text-sm"><a href="#">Get Started</a></Button></div></div></header>
</template>
