<div data-slot="toggle-group" data-type="multiple" class="inline-flex rounded-md border p-1">
  <button
    type="button"
    data-state="on"
    aria-pressed="true"
    class="rounded-sm px-3 py-1.5 text-sm font-medium"
  >
    Bold
  </button>
  <button
    type="button"
    data-state="off"
    aria-pressed="false"
    class="rounded-sm px-3 py-1.5 text-sm font-medium"
  >
    Italic
  </button>
  <button
    type="button"
    data-state="off"
    aria-pressed="false"
    class="rounded-sm px-3 py-1.5 text-sm font-medium"
  >
    Underline
  </button>
</div>
