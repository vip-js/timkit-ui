<div class="timui-html-demo space-y-4 p-4">
<div class="space-y-8 text-center"><div role="group" aria-label="Stepper" orientation="vertical"><div data-slot="stepper-item"><div data-slot="stepper-trigger"><span aria-hidden="true"><span aria-hidden="true"></div><div class="flex justify-center space-x-4"><button type="button" data-slot="button" class="w-32 inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline"="setCurrentStep((prev) => prev - 1)">Prev step
        </button><button type="button" data-slot="button" class="w-32 inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline"="setCurrentStep((prev) => prev + 1)">Next step
        </button></div><p class="text-muted-foreground mt-2 text-xs" role="region" aria-live="polite">Controlled vertical stepper with checkmarks
      </p></div>
</div>
