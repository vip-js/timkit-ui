<template>
  <div class="space-y-8 text-center"><Stepper value="${currentStep}" on-value-change="${setCurrentStep}" orientation="vertical"><!-- Loop steps -->
<StepperItem key="${step}" step="${step}" class="not-last:flex-1"><StepperTrigger aschild><StepperIndicator /></StepperTrigger><!-- if step < steps.length -->
<StepperSeparator />
<!-- endif --></StepperItem>
<!-- End Loop --></Stepper><div class="flex justify-center space-x-4"><Button variant="outline" class="w-32" on-click="${() => setCurrentStep((prev) => prev - 1)}" disabled="${currentStep === 1}">Prev step
        </Button><Button variant="outline" class="w-32" on-click="${() => setCurrentStep((prev) => prev + 1)}" disabled="${currentStep > steps.length}">Next step
        </Button></div><p class="text-muted-foreground mt-2 text-xs" role="region" aria-live="polite">Controlled vertical stepper with checkmarks
      </p></div>
</template>
