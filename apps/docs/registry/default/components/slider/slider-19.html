<div class="timui-html-demo space-y-4 p-4">
<div class="*:not-first:mt-3">
    <label data-slot="label">Dual range slider with input</label>
    <div class="flex items-center gap-4">
      <input data-slot="input" class="h-8 w-12 px-2 py-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm"
       
        type="text"
        inputMode="decimal"
       ="(next) => handleInputChange(next, 0)"
       
       
        aria-label="Enter minimum value" />
      <input type="range" data-slot="slider"
       
       
        aria-label="Dual range slider with input">
      <input data-slot="input" class="h-8 w-12 px-2 py-1 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm"
       
        type="text"
        inputMode="decimal"
       ="(next) => handleInputChange(next, 1)"
       
       
        aria-label="Enter maximum value" />
    </div>
  </div>
</div>
