<div class="timui-html-demo space-y-4 p-4">
<div class="*:not-first:mt-4">
    <label data-slot="label">Price slider</label>

    <div>
      <div class="flex h-12 w-full items-end px-3" aria-hidden="true">
        <div
          class="flex flex-1 justify-center">
          <span class="bg-primary/20 size-full"></span>
        </div>
      </div>

      <input type="range" data-slot="slider"
       
        aria-label="Price range">
    </div>

    <div class="flex items-center justify-between gap-4">
      <div class="*:not-first:mt-1">
        <label data-slot="label" for="Example-min">Min price</label>
        <div class="relative">
          <input data-slot="input" class="peer w-full ps-6 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="Example-min"
           
            type="text"
            inputMode="decimal"
           ="(next) => handleInputChange(next, 0)"
           
           
            aria-label="Enter minimum price" />
          <span class="text-muted-foreground pointer-events-none absolute inset-y-0 start-0 flex items-center justify-center ps-3 text-sm peer-disabled:opacity-50">$
          </span>
        </div>
      </div>

      <div class="*:not-first:mt-1">
        <label data-slot="label" for="Example-max">Max price</label>
        <div class="relative">
          <input data-slot="input" class="peer w-full ps-6 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="Example-max"
           
            type="text"
            inputMode="decimal"
           ="(next) => handleInputChange(next, 1)"
           
           
            aria-label="Enter maximum price" />
          <span class="text-muted-foreground pointer-events-none absolute inset-y-0 start-0 flex items-center justify-center ps-3 text-sm peer-disabled:opacity-50">$
          </span>
        </div>
      </div>
    </div>

    <button type="button" data-slot="button" class="w-full inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline">
      Show  items
    </button>
  </div>
</div>
