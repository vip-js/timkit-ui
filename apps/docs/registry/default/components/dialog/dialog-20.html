<template>
  <Dialog on-open-change="${(open) => {
        if (open) setStep(1)
      }}"><DialogTrigger aschild><Button variant="outline">Onboarding</Button></DialogTrigger><DialogContent class="gap-0 p-0 [&>button:last-child]:text-white"><div class="p-2"><img class="w-full rounded-md" src="/dialog-content.png" width="${382}" height="${216}" alt="dialog" /></div><div class="space-y-6 px-6 pt-3 pb-6"><DialogHeader><DialogTitle>${stepContent[step - 1].title}</DialogTitle><DialogDescription>${stepContent[step - 1].description}</DialogDescription></DialogHeader><div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center"><div class="flex justify-center space-x-1.5 max-sm:order-1"><!-- Loop [...Array(totalSteps)] -->
<div key="${index}" class="${cn(
                    'bg-primary size-1.5 rounded-full',
                    index + 1 === step ? 'bg-primary' : 'opacity-20'
                  )}" />
<!-- End Loop --></div><DialogFooter><DialogClose aschild><Button type="button" variant="ghost">Skip
                </Button></DialogClose><!-- if step < totalSteps -->
<Button class="group" type="button" on-click="${handleContinue}">Next
                  <ArrowRightIcon class="-me-1 opacity-60 transition-transform group-hover:translate-x-0.5" size="${16}" aria-hidden="true" /></Button>
<!-- else -->
<DialogClose aschild><Button type="button">Okay</Button></DialogClose>
<!-- endif --></DialogFooter></div></div></DialogContent></Dialog>
</template>
