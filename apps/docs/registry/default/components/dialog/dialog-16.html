<div class="timui-html-demo space-y-4 p-4">
<dialog open data-slot="dialog">
    <button type="button" data-slot="dialog-trigger" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">
      <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline">Card details</button>
    </button>

    <div data-slot="dialog-content">
      <div class="flex flex-col gap-2">
        <div class="flex size-11 shrink-0 items-center justify-center rounded-full border" aria-hidden="true">
          <span aria-hidden="true" size="16">
        </div>
        <header data-slot="dialog-header">
          <h2 data-slot="dialog-title">Update your card</h2>
          <p data-slot="dialog-description">Your new card will replace your current card.</p>
        </header>
      </div>

      <form class="space-y-5">
        <div class="space-y-4">
          <div class="*:not-first:mt-2">
            <label data-slot="label" for="name-Example">Name on card</label>
            <input data-slot="input" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="name-Example" type="text" required autocomplete="cc-name">
          </div>

          <div class="*:not-first:mt-2">
            <label data-slot="label" for="number-Example">Card Number</label>
            <div class="relative">
              <input data-slot="input" class="peer pe-9 [direction:inherit] flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="number-Example"
               
                inputmode="numeric"
                autocomplete="cc-number">
              <div class="text-muted-foreground/80 pointer-events-none absolute inset-y-0 end-0 flex items-center justify-center pe-3 peer-disabled:opacity-50">
                <span class="text-[10px] font-medium tracking-wide"></span>
                <span aria-hidden="true" size="16" aria-hidden="true">
              </div>
            </div>
          </div>

          <div class="flex gap-4">
            <div class="flex-1 space-y-2">
              <label data-slot="label" for="expiry-Example">Expiry date</label>
              <input data-slot="input" class="[direction:inherit] flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm"
                id="expiry-Example"
                inputmode="numeric"
                autocomplete="cc-exp"
                placeholder="MM/YY">
            </div>
            <div class="flex-1 space-y-2">
              <label data-slot="label" for="cvc-Example">CVC</label>
              <input data-slot="input" class="[direction:inherit] flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm"
                id="cvc-Example"
                inputmode="numeric"
                autocomplete="cc-csc">
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" data-slot="checkbox" id="primary-Example">
          <label data-slot="label" for="primary-Example">
            Set as default payment method
          </label>
        </div>

        <button type="button" data-slot="button" class="w-full inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" type="button">Update card</button>
      </form>
    </div>
  </dialog>
</div>
