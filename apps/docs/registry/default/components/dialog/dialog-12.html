<div class="timui-html-demo space-y-4 p-4">
<dialog open data-slot="dialog">
    <button type="button" data-slot="dialog-trigger" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">
      <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline">OTP code</button>
    </button>
    <div data-slot="dialog-content">
      <div class="flex flex-col items-center gap-2">
        <div class="flex size-11 shrink-0 items-center justify-center rounded-full border" aria-hidden="true">
          <svg class="stroke-zinc-800 dark:stroke-zinc-100" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="12" fill="none" stroke-width="8" />
          </svg>
        </div>
        <header data-slot="dialog-header">
          <h2 data-slot="dialog-title"></h2>
          <p data-slot="dialog-description">
            
          </p>
        </header>
      </div>

      <template>
        <div class="text-center">
          <div data-slot="dialog-close">
            <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" type="button">Close</button>
          
        </div>
</div>
