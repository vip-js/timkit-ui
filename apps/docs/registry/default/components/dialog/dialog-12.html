<template>
  <Dialog><DialogTrigger aschild><Button variant="outline">OTP code</Button></DialogTrigger><DialogContent><div class="flex flex-col items-center gap-2"><div class="flex size-11 shrink-0 items-center justify-center rounded-full border" aria-hidden="true"><svg class="stroke-zinc-800 dark:stroke-zinc-100" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewbox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke-width="8" /></svg></div><DialogHeader><DialogTitle class="sm:text-center"><!-- if hasGuessed -->
${'Code verified!'}
<!-- else -->
${'Enter confirmation code'}
<!-- endif --></DialogTitle><DialogDescription class="sm:text-center"><!-- if hasGuessed -->
${'Your code has been successfully verified.'}
<!-- else -->
${`Check your email and enter the code - Try ${CORRECT_CODE}`}
<!-- endif --></DialogDescription></DialogHeader></div><!-- if hasGuessed -->
<div class="text-center"><DialogClose aschild><Button type="button" ref="${closeButtonRef}">Close
              </Button></DialogClose></div>
<!-- else -->
<div class="space-y-4"><div class="flex justify-center"><OTPInput id="cofirmation-code" ref="${inputRef}" value="${value}" onchange="${setValue}" containerclassname="flex items-center gap-3 has-disabled:opacity-50" maxlength="${4}" onfocus="${() => setHasGuessed(undefined)}" render="${({ slots }) => (
                  <div className="flex gap-2">
                    {slots.map((slot, idx) => (
                      <Slot key={idx} {...slot} />
                    ))}
                  </div>
                )}" oncomplete="${onSubmit}" /></div><!-- if hasGuessed === false -->
<p class="text-muted-foreground text-center text-xs" role="alert" aria-live="polite">Invalid code. Please try again.
              </p>
<!-- endif --><p class="text-center text-sm"><a class="underline hover:no-underline" href="#">Resend code
              </a></p></div>
<!-- endif --></DialogContent></Dialog>
</template>
