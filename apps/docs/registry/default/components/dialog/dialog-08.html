<div class="timui-html-demo space-y-4 p-4">
<dialog open data-slot="dialog">
    <button type="button" data-slot="dialog-trigger" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">
      <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline">Delete project</button>
    </button>
    <div data-slot="dialog-content">
      <div class="flex flex-col items-center gap-2">
        <div class="flex size-9 shrink-0 items-center justify-center rounded-full border" aria-hidden="true">
          <span aria-hidden="true" size="16">
        </div>
        <header data-slot="dialog-header">
          <h2 data-slot="dialog-title">Final confirmation</h2>
          <p data-slot="dialog-description">
            This action cannot be undone. To confirm, please enter the project name
            <span class="text-foreground">Timkit UI</span>.
          </p>
        </header>
      </div>

      <form class="space-y-5">
        <div class="*:not-first:mt-2">
          <label data-slot="label" for="dialog-08">Project name</label>
          <input data-slot="input" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="dialog-08"
            type="text"
            placeholder="Type Timkit UI to confirm">
        </div>
        <footer data-slot="dialog-footer">
          <div data-slot="dialog-close">
            <button type="button" data-slot="button" class="flex-1 inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" type="button" variant="outline">Cancel</button>
          
          <button type="button" data-slot="button" class="flex-1 inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" type="button">Delete</button>
        </footer>
      </form>
    </div>
  </dialog>
</div>
