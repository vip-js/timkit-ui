<div class="timui-html-demo space-y-4 p-4">
<dialog open data-slot="dialog">
    <button type="button" data-slot="dialog-trigger" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">
      <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline">Edit profile</button>
    </button>
    <div data-slot="dialog-content" class="flex flex-col gap-0 overflow-y-visible p-0 sm:max-w-lg [&>button:last-child]:top-3.5">
      <header data-slot="dialog-header">
        <h2 data-slot="dialog-title">Edit profile</h2>
      </header>
      <p data-slot="dialog-description">
        Make changes to your profile here. You can change your photo and set a username.
      </p>

      <div class="overflow-y-auto">
        <div class="h-32">
          <div class="bg-muted relative flex size-full items-center justify-center overflow-hidden">
            <img
             
              class="size-full object-cover" width="512" height="96" />
            <div class="absolute inset-0 flex items-center justify-center gap-2">
              <button
                type="button"
                class="focus-visible:border-ring focus-visible:ring-ring/50 z-50 flex size-10 cursor-pointer items-center justify-center rounded-full bg-black/60 text-white transition-[color,box-shadow] outline-none hover:bg-black/80 focus-visible:ring-[3px]">
                <span aria-hidden="true" size="16" aria-hidden="true">
              </button>
              <button
               
                type="button"
                class="focus-visible:border-ring focus-visible:ring-ring/50 z-50 flex size-10 cursor-pointer items-center justify-center rounded-full bg-black/60 text-white transition-[color,box-shadow] outline-none hover:bg-black/80 focus-visible:ring-[3px]"
               
                aria-label="Remove image">
                <span aria-hidden="true" size="16" aria-hidden="true">
              </button>
            </div>
          </div>
          <input class="sr-only" aria-label="Upload image file" />
        </div>

        <div class="-mt-10 px-6">
          <div class="border-background bg-muted relative flex size-20 items-center justify-center overflow-hidden rounded-full border-4 shadow-xs shadow-black/10">
            <img
             
              class="size-full object-cover" width="80" height="80"
              alt="Profile image" />
            <button
              type="button"
              class="focus-visible:border-ring focus-visible:ring-ring/50 absolute flex size-8 cursor-pointer items-center justify-center rounded-full bg-black/60 text-white transition-[color,box-shadow] outline-none hover:bg-black/80 focus-visible:ring-[3px]"
             
              aria-label="Change profile picture">
              <span aria-hidden="true" size="16" aria-hidden="true">
            </button>
            <input class="sr-only" aria-label="Upload profile picture" />
          </div>
        </div>

        <div class="px-6 pt-4 pb-6">
          <form class="space-y-4">
            <div class="flex flex-col gap-4 sm:flex-row">
              <div class="flex-1 space-y-2">
                <label data-slot="label" for="Example-first-name">First name</label>
                <input data-slot="input" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="Example-first-name" placeholder="Matt" type="text" required>
              </div>
              <div class="flex-1 space-y-2">
                <label data-slot="label" for="Example-last-name">Last name</label>
                <input data-slot="input" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="Example-last-name" placeholder="Welsh" type="text" required>
              </div>
            </div>

            <div class="*:not-first:mt-2">
              <label data-slot="label" for="Example-username">Username</label>
              <div class="relative">
                <input data-slot="input" class="peer pe-9 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="Example-username"
                 
                 
                  placeholder="Username"
                  type="text"
                  required>
                <div class="text-muted-foreground/80 pointer-events-none absolute inset-y-0 end-0 flex items-center justify-center pe-3 peer-disabled:opacity-50">
                  <span aria-hidden="true" size="16" aria-hidden="true">
                </div>
              </div>
            </div>

            <div class="*:not-first:mt-2">
              <label data-slot="label" for="Example-website">Website</label>
              <div class="flex rounded-md shadow-xs">
                <span class="border-input bg-background text-muted-foreground -z-10 inline-flex items-center rounded-s-md border px-3 text-sm">
                  https://
                </span>
                <input data-slot="input" class="-ms-px rounded-s-none shadow-none flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="Example-website"
                 
                 
                  placeholder="yourwebsite.com"
                  type="text">
              </div>
            </div>

            <div class="*:not-first:mt-2">
              <label data-slot="label" for="Example-bio">Biography</label>
              <textarea data-slot="textarea" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="Example-bio"
               
                placeholder="Write a few sentences about yourself" aria-describedby="Example-description"></textarea>
              <p id="Example-description" class="text-muted-foreground mt-2 text-right text-xs" role="status" aria-live="polite">
                <span class="tabular-nums"></span> characters left
              </p>
            </div>
          </form>
        </div>
      </div>

      <footer data-slot="dialog-footer">
        <div data-slot="dialog-close">
          <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" type="button" variant="outline">Cancel</button>
        
        <div data-slot="dialog-close">
          <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" type="button">Save changes</button>
        
      </footer>
    </div>
  </dialog>
</div>
