<dialog>
      <dialog-trigger asChild>
        <button variant="outline">Sign in</button>
      </dialog-trigger>
      <dialog-content>
        <div class="flex flex-col items-center gap-2">
          <div
            class="flex size-11 shrink-0 items-center justify-center rounded-full border"
            aria-hidden="true"
          >
            <svg
              class="stroke-zinc-800 dark:stroke-zinc-100"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 32 32"
              aria-hidden="true"
            >
              <circle cx="16" cy="16" r="12" fill="none" strokeWidth="8" />
            </svg>
          </div>
          <dialog-header>
            <dialog-title class="sm:text-center">Welcome back</dialog-title>
            <dialog-description class="sm:text-center">
              Enter your credentials to login to your account.
            </dialog-description>
          </dialog-header>
        </div>

        <form class="space-y-5">
          <div class="space-y-4">
            <div class="*:not-first:mt-2">
              <label for="dialog-14-id">Email</label>
              <input id="dialog-14-id" placeholder="hi@yourcompany.com" type="email" required />
            </div>
            <div class="*:not-first:mt-2">
              <label for="dialog-14-id">Password</label>
              <input id="dialog-14-id"
                placeholder="Enter your password"
                type="password"
                required
              />
            </div>
          </div>
          <div class="flex justify-between gap-2">
            <div class="flex items-center gap-2">
              <checkbox id="dialog-14-id" />
              <label for="dialog-14-id" class="text-muted-foreground font-normal">
                Remember me
              </label>
            </div>
            <a class="text-sm underline hover:no-underline" href="#">
              Forgot password?
            </a>
          </div>
          <button type="button" class="w-full">
            Sign in
          </button>
        </form>

        <div class="before:bg-border after:bg-border flex items-center gap-3 before:h-px before:flex-1 after:h-px after:flex-1">
          <span class="text-muted-foreground text-xs">Or</span>
        </div>

        <button variant="outline">Login with Google</button>
      </dialog-content>
    </dialog>
