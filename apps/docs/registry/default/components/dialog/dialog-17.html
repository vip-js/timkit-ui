<div class="timui-html-demo space-y-4 p-4">
<dialog open data-slot="dialog">
    <button type="button" data-slot="dialog-trigger" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground">
      <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline">Checkout</button>
    </button>
    <div data-slot="dialog-content">
      <div class="mb-2 flex flex-col gap-2">
        <div class="flex size-11 shrink-0 items-center justify-center rounded-full border" aria-hidden="true">
          <span aria-hidden="true" size="16">
        </div>
        <header data-slot="dialog-header">
          <h2 data-slot="dialog-title">Confirm and pay</h2>
          <p data-slot="dialog-description">Pay securely and cancel any time.</p>
        </header>
      </div>

      <form class="space-y-5">
        <div class="space-y-4">
          <div role="radiogroup" data-slot="radio-group">
            <label class="border-input has-data-[state=checked]:border-primary/50 has-focus-visible:border-ring has-focus-visible:ring-ring/50 relative flex cursor-pointer flex-col gap-1 rounded-md border px-4 py-3 shadow-xs transition-[color,box-shadow] outline-none has-focus-visible:ring-[3px]">
              <input type="radio" data-slot="radio-group-item" id="radio-monthly" value="monthly">
              <p class="text-foreground text-sm font-medium">Monthly</p>
              <p class="text-muted-foreground text-sm">$32/month</p>
            </label>
            <label class="border-input has-data-[state=checked]:border-primary/50 has-focus-visible:border-ring has-focus-visible:ring-ring/50 relative flex cursor-pointer flex-col gap-1 rounded-md border px-4 py-3 shadow-xs transition-[color,box-shadow] outline-none has-focus-visible:ring-[3px]">
              <input type="radio" data-slot="radio-group-item" id="radio-yearly" value="yearly">
              <div class="inline-flex items-start justify-between gap-2">
                <p class="text-foreground text-sm font-medium">Yearly</p>
                <span data-slot="badge">Popular</span>
              </div>
              <p class="text-muted-foreground text-sm">$320/month</p>
            </label>
          </div>

          <div class="*:not-first:mt-2">
            <label data-slot="label" for="name-Example">Name on card</label>
            <input data-slot="input" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="name-Example" type="text" required>
          </div>

          <div class="*:not-first:mt-2">
            <legend class="text-foreground text-sm font-medium">Card Details</legend>
            <div class="rounded-md shadow-xs">
              <div class="relative focus-within:z-10">
                <input data-slot="input" class="peer rounded-b-none pe-9 shadow-none flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" placeholder="Card number">
                <div class="text-muted-foreground/80 pointer-events-none absolute inset-y-0 end-0 flex items-center justify-center pe-3 peer-disabled:opacity-50">
                  <span aria-hidden="true" size="16" aria-hidden="true">
                </div>
              </div>
              <div class="-mt-px flex">
                <div class="min-w-0 flex-1 focus-within:z-10">
                  <input data-slot="input" class="rounded-e-none rounded-t-none shadow-none flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" placeholder="MM/YY">
                </div>
                <div class="-ms-px min-w-0 flex-1 focus-within:z-10">
                  <input data-slot="input" class="rounded-s-none rounded-t-none shadow-none flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" placeholder="CVC">
                </div>
              </div>
            </div>
          </div>

          <template>
            <button type="button" class="text-sm underline hover:no-underline">+ Add coupon</button>
</div>
