<template>
  <div class="space-y-4"><div class="flex flex-wrap items-center justify-between gap-3"><div class="flex items-center gap-3"><div class="relative"><Input id="${`${id}-input`}" ref="${inputRef}" class="${cn(
                'peer min-w-60 ps-9',
                Boolean(table.getColumn('name')?.getFilterValue()) && 'pe-9'
              )}" value="${(table.getColumn('name')?.getFilterValue() ?? '') as string}" onchange="${(e) => table.getColumn('name')?.setFilterValue(e.target.value)}" placeholder="Filter by name or email..." type="text" aria-label="Filter by name or email" /><div class="text-muted-foreground/80 pointer-events-none absolute inset-y-0 start-0 flex items-center justify-center ps-3 peer-disabled:opacity-50"><ListFilterIcon size="${16}" aria-hidden="true" /></div><!-- if Boolean(table.getColumn('name')?.getFilterValue()) -->
<button class="text-muted-foreground/80 hover:text-foreground focus-visible:border-ring focus-visible:ring-ring/50 absolute inset-y-0 end-0 flex h-full w-9 items-center justify-center rounded-e-md transition-[color,box-shadow] outline-none focus:z-10 focus-visible:ring-[3px] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50" aria-label="Clear filter" on-click="${() => {
                  table.getColumn('name')?.setFilterValue('')
                  if (inputRef.current) {
                    inputRef.current.focus()
                  }
                }}"><CircleXIcon size="${16}" aria-hidden="true" /></button>
<!-- endif --></div><Popover><PopoverTrigger aschild><Button variant="outline"><FilterIcon class="-ms-1 opacity-60" size="${16}" aria-hidden="true" />Status
                <!-- if selectedStatuses.length > 0 -->
<span class="bg-background text-muted-foreground/70 -me-1 inline-flex h-5 max-h-full items-center rounded border px-1 font-[inherit] text-[0.625rem] font-medium">${selectedStatuses.length}</span>
<!-- endif --></Button></PopoverTrigger><PopoverContent class="w-auto min-w-36 p-3" align="start"><div class="space-y-3"><div class="text-muted-foreground text-xs font-medium">Filters</div><div class="space-y-3"><!-- Loop uniqueStatusValues -->
<div key="${value}" class="flex items-center gap-2"><Checkbox id="${`${id}-${i}`}" checked="${selectedStatuses.includes(value)}" oncheckedchange="${(checked: boolean | 'indeterminate') =>
                          handleStatusChange(checked, value)}" /><Label htmlfor="${`${id}-${i}`}" class="flex grow justify-between gap-2 font-normal">${value}${' '}<span class="text-muted-foreground ms-2 text-xs">${statusCounts.get(value)}</span></Label></div>
<!-- End Loop --></div></div></PopoverContent></Popover><DropdownMenu><DropdownMenuTrigger aschild><Button variant="outline"><Columns3Icon class="-ms-1 opacity-60" size="${16}" aria-hidden="true" />View
              </Button></DropdownMenuTrigger><DropdownMenuContent align="end"><DropdownMenuLabel>Toggle columns</DropdownMenuLabel>${table
                .getAllColumns()
                .filter((column) => column.getCanHide())
                .map((column) => {
                  return (
                    <DropdownMenuCheckboxItem
                      key={column.id}
                      className="capitalize"
                      checked={column.getIsVisible()}
                      onCheckedChange={(value: boolean | 'indeterminate') =>
                        column.toggleVisibility(!!value)
                      }
                      onSelect={(event: SyntheticEvent) => event.preventDefault()}
                    >
                      {column.id}
                    </DropdownMenuCheckboxItem>
                  )
                })}</DropdownMenuContent></DropdownMenu></div><div class="flex items-center gap-3"><!-- if table.getSelectedRowModel().rows.length > 0 -->
<AlertDialog><AlertDialogTrigger aschild><Button class="ml-auto" variant="outline"><TrashIcon class="-ms-1 opacity-60" size="${16}" aria-hidden="true" />Delete
                  <span class="bg-background text-muted-foreground/70 -me-1 inline-flex h-5 max-h-full items-center rounded border px-1 font-[inherit] text-[0.625rem] font-medium">${table.getSelectedRowModel().rows.length}</span></Button></AlertDialogTrigger><AlertDialogContent><div class="flex flex-col gap-2 max-sm:items-center sm:flex-row sm:gap-4"><div class="flex size-9 shrink-0 items-center justify-center rounded-full border" aria-hidden="true"><CircleAlertIcon class="opacity-80" size="${16}" /></div><AlertDialogHeader><AlertDialogTitle>Are you absolutely sure?</AlertDialogTitle><AlertDialogDescription>This action cannot be undone. This will permanently delete${' '}${table.getSelectedRowModel().rows.length}selected${' '}<!-- if table.getSelectedRowModel().rows.length === 1 -->
${'row'}
<!-- else -->
${'rows'}
<!-- endif -->.
                    </AlertDialogDescription></AlertDialogHeader></div><AlertDialogFooter><AlertDialogCancel>Cancel</AlertDialogCancel><AlertDialogAction on-click="${handleDeleteRows}">Delete</AlertDialogAction></AlertDialogFooter></AlertDialogContent></AlertDialog>
<!-- endif --><Button class="ml-auto" variant="outline"><PlusIcon class="-ms-1 opacity-60" size="${16}" aria-hidden="true" />Add user
          </Button></div></div><div class="bg-background overflow-hidden rounded-md border"><Table class="table-fixed"><TableHeader><!-- Loop table.getHeaderGroups() -->
<TableRow key="${headerGroup.id}" class="hover:bg-transparent">${headerGroup.headers.map((header) => {
                  return (
                    <TableHead
                      key={header.id}
                      style={{ width: `${header.getSize()}px` }}
                      className="h-11"
                    >
                      {header.isPlaceholder ? null : header.column.getCanSort() ? (
                        <div
                          className={cn(
                            header.column.getCanSort() &&
                              'flex h-full cursor-pointer items-center justify-between gap-2 select-none'
                          )}
                          onClick={header.column.getToggleSortingHandler()}
                          onKeyDown={(e) => {
                            // Enhanced keyboard handling for sorting
                            if (
                              header.column.getCanSort() &&
                              (e.key === 'Enter' || e.key === ' ')
                            ) {
                              e.preventDefault()
                              header.column.getToggleSortingHandler()?.(e)
                            }
                          }}
                          tabIndex={header.column.getCanSort() ? 0 : undefined}
                        >
                          {flexRender(header.column.columnDef.header, header.getContext())}
                          {{
                            asc: (
                              <ChevronUpIcon
                                className="shrink-0 opacity-60"
                                size={16}
                                aria-hidden="true"
                              />
                            ),
                            desc: (
                              <ChevronDownIcon
                                className="shrink-0 opacity-60"
                                size={16}
                                aria-hidden="true"
                              />
                            ),
                          }[header.column.getIsSorted() as string] ?? null}
                        </div>
                      ) : (
                        flexRender(header.column.columnDef.header, header.getContext())
                      )}
                    </TableHead>
                  )
                })}</TableRow>
<!-- End Loop --></TableHeader><TableBody><!-- if table.getRowModel().rows?.length -->
${table.getRowModel().rows.map((row) => (
                <TableRow key={row.id} data-state={row.getIsSelected() && 'selected'}>
                  {row.getVisibleCells().map((cell) => (
                    <TableCell key={cell.id} className="last:py-0">
                      {flexRender(cell.column.columnDef.cell, cell.getContext())}
                    </TableCell>
                  ))}
                </TableRow>
              ))}
<!-- else -->
<TableRow><TableCell colspan="${columns.length}" class="h-24 text-center">No results.
                </TableCell></TableRow>
<!-- endif --></TableBody></Table></div><div class="flex items-center justify-between gap-8"><div class="flex items-center gap-3"><Label htmlfor="${id}" class="max-sm:sr-only">Rows per page
          </Label><Select value="${table.getState().pagination.pageSize.toString()}" on-value-change="${(value: string) => {
              table.setPageSize(Number(value))
            }}"><SelectTrigger id="${id}" class="w-fit whitespace-nowrap"><SelectValue placeholder="Select number of results" /></SelectTrigger><SelectContent class="[&_*[role=option]]:ps-2 [&_*[role=option]]:pe-8 [&_*[role=option]>span]:start-auto [&_*[role=option]>span]:end-2"><!-- Loop [5, 10, 25, 50] -->
<SelectItem key="${pageSize}" value="${pageSize.toString()}">${pageSize}</SelectItem>
<!-- End Loop --></SelectContent></Select></div><div class="text-muted-foreground flex grow justify-end text-sm whitespace-nowrap"><p class="text-muted-foreground text-sm whitespace-nowrap" aria-live="polite"><span class="text-foreground">${table.getState().pagination.pageIndex * table.getState().pagination.pageSize + 1}-
              ${Math.min(
                Math.max(
                  table.getState().pagination.pageIndex * table.getState().pagination.pageSize +
                    table.getState().pagination.pageSize,
                  0
                ),
                table.getRowCount()
              )}</span>${' '}of <span class="text-foreground">${table.getRowCount().toString()}</span></p></div><div><Pagination><PaginationContent><PaginationItem><Button size="icon" variant="outline" class="disabled:pointer-events-none disabled:opacity-50" on-click="${() => table.firstPage()}" disabled="${!table.getCanPreviousPage()}" aria-label="Go to first page"><ChevronFirstIcon size="${16}" aria-hidden="true" /></Button></PaginationItem><PaginationItem><Button size="icon" variant="outline" class="disabled:pointer-events-none disabled:opacity-50" on-click="${() => table.previousPage()}" disabled="${!table.getCanPreviousPage()}" aria-label="Go to previous page"><ChevronLeftIcon size="${16}" aria-hidden="true" /></Button></PaginationItem><PaginationItem><Button size="icon" variant="outline" class="disabled:pointer-events-none disabled:opacity-50" on-click="${() => table.nextPage()}" disabled="${!table.getCanNextPage()}" aria-label="Go to next page"><ChevronRightIcon size="${16}" aria-hidden="true" /></Button></PaginationItem><PaginationItem><Button size="icon" variant="outline" class="disabled:pointer-events-none disabled:opacity-50" on-click="${() => table.lastPage()}" disabled="${!table.getCanNextPage()}" aria-label="Go to last page"><ChevronLastIcon size="${16}" aria-hidden="true" /></Button></PaginationItem></PaginationContent></Pagination></div></div><p class="text-muted-foreground mt-4 text-center text-sm">Example of a more complex table made with${' '}<a class="hover:text-foreground underline" href="https://tanstack.com/table" target="_blank" rel="noopener noreferrer">TanStack Table
        </a></p></div>
</template>
