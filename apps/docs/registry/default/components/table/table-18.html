<div class="timui-html-demo space-y-4 p-4">
<div class="space-y-4">
    <div class="bg-background overflow-hidden rounded-md border">
      <table data-slot="table">
        <thead>
          <tr>
            <th>
              <span class="flex items-center gap-1">Name <component size="14" /></span>
            </th>
            <th>
              <span class="flex items-center gap-1">Email <component size="14" /></span>
            </th>
            <th>
              <span class="flex items-center gap-1">Location <component size="14" /></span>
            </th>
            <th>
              <span class="flex items-center gap-1">Status <component size="14" /></span>
            </th>
            <th>
              <span class="flex items-center justify-end gap-1">Balance <component size="14" /></span>
            </th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td> </td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex items-center justify-between gap-4 max-sm:flex-col">
      <p class="text-muted-foreground text-sm" aria-live="polite"></p>

      <div class="flex items-center gap-2">
        <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" size="icon" variant="outline" aria-label="Go to first page">
          <span aria-hidden="true" size="16">
        </button>
        <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" size="icon" variant="outline" aria-label="Go to previous page">
          <span aria-hidden="true" size="16">
        </button>
        <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" size="icon" variant="outline" aria-label="Go to next page">
          <span aria-hidden="true" size="16">
        </button>
        <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" size="icon" variant="outline" aria-label="Go to last page">
          <span aria-hidden="true" size="16">
        </button>
      </div>

      <div class="flex items-center gap-2">
        <label data-slot="label" for="table-18-page-size">Rows per page</label>
        <select data-slot="select">
          <button type="button" data-slot="select-trigger" id="table-18-page-size">
            <span data-slot="select-value" placeholder="Page size"></span>
          </button>
          <div data-slot="select-content">
            <option data-slot="select-item" value="5">5</option>
            <option data-slot="select-item" value="10">10</option>
            <option data-slot="select-item" value="25">25</option>
            <option data-slot="select-item" value="50">50</option>
          </div>
        </select>
      </div>
    </div>

    <p class="text-muted-foreground mt-4 text-center text-sm">
      Paginated table made with
      <a class="hover:text-foreground underline" href="https://tanstack.com/table" target="_blank" rel="noopener noreferrer">
        TanStack Table
      </a>
    </p>
  </div>
</div>
