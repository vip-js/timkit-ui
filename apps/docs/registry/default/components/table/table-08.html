<template>
  <div><div class="bg-background overflow-hidden rounded-md border"><Table><TableHeader><TableRow class="hover:bg-transparent"><TableHead class="h-11"><Checkbox checked="${allSelected || (someSelected && 'indeterminate')}" oncheckedchange="${(value) => {
                    const checked = toChecked(value)
                    setSelectedRows(Object.fromEntries(items.map((item) => [item.id, checked])))
                  }}" on-click="${() => {
                    const next = !allSelected
                    setSelectedRows(Object.fromEntries(items.map((item) => [item.id, next])))
                  }}" aria-label="Select all rows" /></TableHead><TableHead class="h-11">Name</TableHead><TableHead class="h-11">Email</TableHead><TableHead class="h-11">Location</TableHead><TableHead class="h-11">Status</TableHead><TableHead class="h-11 text-right">Balance</TableHead></TableRow></TableHeader><TableBody><!-- Loop items -->
<TableRow key="${item.id}" data-state="${selectedRows[item.id] ? 'selected' : undefined}"><TableCell><Checkbox id="${`table-checkbox-${item.id}`}" checked="${!!selectedRows[item.id]}" oncheckedchange="${(value) => {
                      const checked = toChecked(value)
                      setSelectedRows((prev) => ({ ...prev, [item.id]: checked }))
                    }}" on-click="${() => {
                      setSelectedRows((prev) => ({ ...prev, [item.id]: !prev[item.id] }))
                    }}" aria-label="${`Select ${item.name}`}" /></TableCell><TableCell class="font-medium">${item.name}</TableCell><TableCell>${item.email}</TableCell><TableCell>${item.location}</TableCell><TableCell>${item.status}</TableCell><TableCell class="text-right">${item.balance}</TableCell></TableRow>
<!-- End Loop --></TableBody><TableFooter class="bg-transparent"><TableRow class="hover:bg-transparent"><TableCell colspan="${5}">Total</TableCell><TableCell class="text-right">$2,500.00</TableCell></TableRow></TableFooter></Table></div><p class="text-muted-foreground mt-4 text-center text-sm">Card Table</p></div>
</template>
