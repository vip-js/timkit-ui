<div class="timui-html-demo space-y-4 p-4">
<div class="space-y-4">
    <div class="bg-background overflow-hidden rounded-md border">
      <table data-slot="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Location</th>
            <th>Status</th>
            <th>Balance</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td> </td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex items-center justify-between gap-3 max-sm:flex-col">
      <p class="text-muted-foreground flex-1 text-sm whitespace-nowrap" aria-live="polite">
        Page <span class="text-foreground"></span> of <span class="text-foreground"></span>
      </p>

      <div class="grow">
        <nav aria-label="Pagination">
          <ul>
            <li>
              <button type="button" data-slot="button" class="disabled:pointer-events-none disabled:opacity-50 inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
                size="icon"
                variant="outline"
               
                aria-label="Go to previous page">
                <span aria-hidden="true" size="16" aria-hidden="true">
              </button>
            </li>

            <li>
              <span aria-hidden="true">
            </li>

            <li>
              <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
                size="icon">
                
              </button>
            </li>

            <li>
              <span aria-hidden="true">
            </li>

            <li>
              <button type="button" data-slot="button" class="disabled:pointer-events-none disabled:opacity-50 inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
                size="icon"
                variant="outline"
               
                aria-label="Go to next page">
                <span aria-hidden="true" size="16" aria-hidden="true">
              </button>
            </li>
          </ul>
        </nav>
      </div>

      <div class="flex flex-1 justify-end">
        <select data-slot="select" aria-label="Results per page">
          <button type="button" data-slot="select-trigger">
            <span data-slot="select-value" placeholder="Select number of results"></span>
          </button>
          <div data-slot="select-content">
            <option data-slot="select-item" value="5">5 / page</option>
            <option data-slot="select-item" value="10">10 / page</option>
            <option data-slot="select-item" value="25">25 / page</option>
            <option data-slot="select-item" value="50">50 / page</option>
          </div>
        </select>
      </div>
    </div>

    <p class="text-muted-foreground mt-4 text-center text-sm">
      Numeric pagination made with
      <a class="hover:text-foreground underline" href="https://tanstack.com/table" target="_blank" rel="noopener noreferrer">
        TanStack Table
      </a>
    </p>
  </div>
</div>
