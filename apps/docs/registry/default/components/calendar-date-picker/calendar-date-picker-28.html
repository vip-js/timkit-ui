<template>
  <div><div class="*:not-first:mt-2"><Label htmlfor="${id}">Date range picker</Label><Popover ids="${{ trigger: id }}"><PopoverTrigger aschild><Button id="${id}" variant="outline" class="group bg-background hover:bg-background border-input w-full justify-between px-3 font-normal outline-offset-0 outline-none focus-visible:outline-[3px]"><span class="${cn('truncate', !date && 'text-muted-foreground')}"><!-- if date?.from -->
${date.to ? (
                    <>
                      {format(date.from, 'LLL dd, y')} - {format(date.to, 'LLL dd, y')}
                    </>
                  ) : (
                    format(date.from, 'LLL dd, y')
                  )}
<!-- else -->
${'Pick a date range'}
<!-- endif --></span><CalendarIcon size="${16}" class="text-muted-foreground/80 group-hover:text-foreground shrink-0 transition-colors" aria-hidden="true" /></Button></PopoverTrigger><PopoverContent class="w-auto p-2" align="start"><Calendar mode="range" selected="${date}" onSelect="${(next: CalendarSelectedValue) =>
                setDate(next as CalendarRangeValue | undefined)}" /></PopoverContent></Popover></div><p class="text-muted-foreground mt-2 text-xs" role="region" aria-live="polite">Built with${' '}<a class="hover:text-foreground underline" href="https://daypicker.dev/" target="_blank" rel="noopener nofollow">React DayPicker
        </a></p></div>
</template>
