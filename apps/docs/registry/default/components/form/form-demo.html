<div class="timui-html-demo space-y-4 p-4">
<form>
    <label for="name">Name</label>
    <input
      type="text"
      aria-label="Name" />
    <p id="name-error" role="alert"></p>
    <label for="email">Email</label>
    <input
      type="email"
      aria-label="Email" />
    <p id="email-error" role="alert"></p>
    <label>
      <input
        type="checkbox"
        aria-label="Accept terms" />
      Accept terms
    </label>
    <p id="terms-error" role="alert"></p>
    <button type="submit">Create account</button>
    <p></p>
  </form>
</div>
