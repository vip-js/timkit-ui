<div
  role="status"
  aria-live="polite"
  data-slot="toast"
  data-state="open"
  class="group relative flex w-full max-w-md items-start justify-between gap-4 rounded-md border bg-background p-4 text-foreground shadow-md"
>
  <div class="space-y-1">
    <div data-slot="toast-title" class="text-sm font-semibold">Coverage refreshed</div>
    <div data-slot="toast-description" class="text-sm text-muted-foreground">
      Docs matrix now reports React, Vue, HTML, and Weapp sample coverage by family.
    </div>
  </div>
  <button
    type="button"
    data-slot="toast-close"
    class="rounded-md p-1 text-muted-foreground transition hover:text-foreground"
    aria-label="Close toast"
  >
    Close
  </button>
</div>
