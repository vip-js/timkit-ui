<template>
  <div class="flex flex-col gap-4"><Popover on-open-change="${(open) => {
          if (open) setCurrentTip(0)
        }}"><div class="grid grid-cols-2 place-items-center gap-4"><!-- Loop tourSteps -->

${'Start over'}

${'Next'}
<!-- endif --></button></div></div></PopoverContent></Popover></div>
</template>
