<div data-slot="popover" class="relative inline-block">
  <button
    data-slot="popover-trigger"
    type="button"
    aria-expanded="false"
    class="inline-flex h-9 items-center rounded-md border px-3 text-sm font-medium"
  >
    Share
  </button>
  <div
    data-slot="popover-content"
    data-state="closed"
    hidden
    class="absolute left-0 top-full z-10 mt-2 w-72 rounded-md border bg-popover p-4 shadow-md"
  >
    <div class="space-y-3 text-center">
      <div class="text-sm font-medium">Share code</div>
      <div class="flex flex-wrap justify-center gap-2">
        <button type="button" class="rounded-md border px-2 py-1 text-xs">Embed</button>
        <button type="button" class="rounded-md border px-2 py-1 text-xs">Twitter</button>
        <button type="button" class="rounded-md border px-2 py-1 text-xs">Facebook</button>
        <button type="button" class="rounded-md border px-2 py-1 text-xs">Email</button>
      </div>
      <div class="space-y-2">
        <input
          id="popover-07-id"
          class="w-full rounded-md border px-3 py-2 text-sm"
          type="text"
          value="https://ui.timkit.cn/Avx8HD"
          aria-label="Share link"
          readonly
        />
        <button type="button" class="w-full rounded-md border px-2 py-1 text-xs">Copy link</button>
      </div>
    </div>
  </div>
</div>
