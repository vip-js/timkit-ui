<div class="timui-html-demo space-y-4 p-4">
<div data-slot="popover">
    <button type="button" data-slot="popover-trigger">
      <button type="button" data-slot="button" class="relative inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" size="icon" variant="outline" aria-label="Open notifications">
        <span aria-hidden="true" size="16" aria-hidden="true">
        <span data-slot="badge"="unreadCount> 0" class="absolute -top-2 left-full min-w-5 -translate-x-1/2 px-1">
          
        </span>
      </button>
    </button>
    <div data-slot="popover-content">
      <div class="flex items-baseline justify-between gap-4 px-3 py-2">
        <div class="text-sm font-semibold">Notifications</div>
        <button class="text-xs font-medium hover:underline">
          Mark all as read
        </button>
      </div>
      <div role="separator" aria-orientation="horizontal" class="bg-border -mx-1 my-1 h-px" />
      <div
        class="hover:bg-accent rounded-md px-3 py-2 text-sm transition-colors">
        <div class="relative flex items-start pe-3">
          <div class="flex-1 space-y-1">
            <button
              class="text-foreground/80 text-left after:absolute after:inset-0">
              <span class="text-foreground font-medium hover:underline"></span>
                
              <span class="text-foreground font-medium hover:underline"></span>.
            </button>
            <div class="text-muted-foreground text-xs"></div>
          </div>
          <div class="absolute end-0 self-center">
            <span class="sr-only">Unread</span>
            <svg width="6" height="6" fill="currentColor" viewBox="0 0 6 6" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="3" cy="3" r="3" />
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
