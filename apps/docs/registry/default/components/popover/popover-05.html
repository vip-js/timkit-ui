<div data-slot="popover" class="relative inline-block">
  <button
    data-slot="popover-trigger"
    type="button"
    aria-expanded="false"
    class="inline-flex h-9 items-center rounded-md border px-3 text-sm font-medium"
  >
    Tooltip-like with steps
  </button>
  <div
    data-slot="popover-content"
    data-state="closed"
    hidden
    class="absolute left-1/2 top-full z-10 mt-2 w-72 -translate-x-1/2 rounded-md border bg-popover p-4 shadow-md"
  >
    <div class="space-y-3">
      <div class="space-y-1">
        <p class="text-[13px] font-medium">Welcome to onboarding</p>
        <p class="text-xs text-muted-foreground">Step 1 of 3. Start with the release checklist.</p>
      </div>
      <div class="flex items-center justify-between gap-2">
        <span class="text-xs text-muted-foreground">1 / 3</span>
        <button type="button" class="text-xs font-medium hover:underline">Next</button>
      </div>
    </div>
  </div>
</div>
