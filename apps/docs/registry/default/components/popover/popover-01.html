<div data-slot="popover" class="relative inline-block">
  <button
    data-slot="popover-trigger"
    type="button"
    aria-expanded="false"
    class="inline-flex h-9 items-center rounded-md border px-3 text-sm font-medium"
  >
    Filters
  </button>
  <div
    data-slot="popover-content"
    data-state="closed"
    hidden
    class="absolute left-0 top-full z-10 mt-2 w-56 rounded-md border bg-popover p-4 shadow-md"
  >
    <div class="space-y-3">
      <div class="text-xs font-medium text-muted-foreground">Filters</div>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" checked /> Real time</label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" /> Top channels</label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" /> Last orders</label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" /> Total spent</label>
      <div class="flex justify-between gap-2 pt-2">
        <button type="button" class="rounded-md border px-2 py-1 text-xs">Clear</button>
        <button type="button" class="rounded-md bg-primary px-2 py-1 text-xs text-primary-foreground">Apply</button>
      </div>
    </div>
  </div>
</div>
