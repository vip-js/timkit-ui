<div data-slot="popover" class="relative inline-block">
  <button
    data-slot="popover-trigger"
    type="button"
    aria-expanded="false"
    class="inline-flex h-9 items-center rounded-md border px-3 text-sm font-medium"
  >
    Tooltip-like popover
  </button>
  <div
    data-slot="popover-content"
    data-state="closed"
    hidden
    class="absolute left-1/2 top-full z-10 mt-2 w-72 -translate-x-1/2 rounded-md border bg-popover p-4 shadow-md"
  >
    <div class="space-y-3">
      <div class="space-y-1">
        <p class="text-[13px] font-medium">Popover with button</p>
        <p class="text-xs text-muted-foreground">
          This keeps popover semantics while still allowing interactive content inside.
        </p>
      </div>
      <button type="button" class="rounded-md border px-2 py-1 text-xs">Know more</button>
    </div>
  </div>
</div>
