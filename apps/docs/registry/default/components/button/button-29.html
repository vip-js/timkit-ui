<div class="timui-html-demo space-y-4 p-4">
<div class="inline-flex items-center" role="group" aria-labelledby="volume-control">
    <span id="volume-control" class="sr-only">Volume Control</span>
    <button type="button" data-slot="button" class="rounded-full inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
     
      variant="outline"
      size="icon"
      aria-label="Decrease volume">
      <span aria-hidden="true" size="16" aria-hidden="true">
    </button>
    <div class="flex items-center px-3 text-sm font-medium tabular-nums" aria-live="polite">
      <component class="opacity-60" size="16" aria-hidden="true" />
      <span class="ms-2" aria-label="Current volume is Example"></span>
    </div>
    <button type="button" data-slot="button" class="rounded-full inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
     
      variant="outline"
      size="icon"
      aria-label="Increase volume">
      <span aria-hidden="true" size="16" aria-hidden="true">
    </button>
  </div>
</div>
