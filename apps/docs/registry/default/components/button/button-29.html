<div class="inline-flex items-center" role="group" aria-labelledby="volume-control">
  <span id="volume-control" class="sr-only"> Volume Control </span>
  <button type="button" data-slot="button"
    class="inline-flex items-center justify-center whitespace-nowrap text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground h-9 w-9 rounded-full"
    aria-label="Decrease volume"
    onclick="const span = this.nextElementSibling.querySelector('span'); let val = parseInt(span.textContent); if (val > 0) { val--; span.textContent = val; span.setAttribute('aria-label', 'Current volume is ' + val); this.nextElementSibling.nextElementSibling.disabled = false; } this.disabled = val === 0;">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minus" aria-hidden="true">
      <path d="M5 12h14" />
    </svg>
  </button>
  <div class="flex items-center px-3 text-sm font-medium tabular-nums" aria-live="polite">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume-1 opacity-60"
      aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
    </svg>
    <span class="ms-2" aria-label="Current volume is 3">3</span>
  </div>
  <button type="button" data-slot="button"
    class="inline-flex items-center justify-center whitespace-nowrap text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground h-9 w-9 rounded-full"
    aria-label="Increase volume"
    onclick="const span = this.previousElementSibling.querySelector('span'); let val = parseInt(span.textContent); if (val < 6) { val++; span.textContent = val; span.setAttribute('aria-label', 'Current volume is ' + val); this.previousElementSibling.previousElementSibling.disabled = false; } this.disabled = val === 6;">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true">
      <path d="M5 12h14" />
      <path d="M12 5v14" />
    </svg>
  </button>
</div>
