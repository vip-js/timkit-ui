<div class="timui-html-demo space-y-4 p-4">
<div class="flex flex-col gap-2">
    <div
      class="border-input data-[dragging=true]:bg-accent/50 has-[input:focus]:border-ring has-[input:focus]:ring-ring/50 relative flex min-h-52 flex-col items-center overflow-hidden rounded-xl border border-dashed p-4 transition-colors not-data-[files]:justify-center has-[input:focus]:ring-[3px]">
      <input
        ref="inputRef"
        class="sr-only"
        type="file"
        multiple accept="*"
        aria-label="Upload file" />

      <template>
        <div class="flex w-full flex-col gap-3">
          <div class="flex items-center justify-between gap-2">
            <h3 class="truncate text-sm font-medium">Files ()</h3>
            <div class="flex gap-2">
              <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline" size="sm">
                <span aria-hidden="true" aria-hidden="true">
                Add files
              </button>
              <button type="button" data-slot="button" class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground" variant="outline" size="sm">
                <span aria-hidden="true" aria-hidden="true">
                Remove all
              </button>
            </div>
          </div>

          <div class="w-full space-y-2">
            <div
              class="bg-background flex flex-col gap-1 rounded-lg border p-2 pe-3 transition-opacity duration-300">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-3 overflow-hidden in-data-[uploading=true]:opacity-50">
                  <div class="flex aspect-square size-10 shrink-0 items-center justify-center rounded border">
                    <component class="size-5 opacity-60" />
                  </div>
                  <div class="flex min-w-0 flex-col gap-0.5">
                    <p class="truncate text-[13px] font-medium"></p>
                    <p class="text-muted-foreground text-xs"></p>
                  </div>
                </div>
                <button type="button" data-slot="button" class="text-muted-foreground/80 hover:text-foreground -me-2 size-8 hover:bg-transparent inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
                  size="icon"
                  variant="ghost"
                 
                  aria-label="Remove file">
                  <span aria-hidden="true" aria-hidden="true">
                </button>
              </div>

              <div
               
                class="mt-1 flex items-center gap-2">
                <div class="h-1.5 w-full overflow-hidden rounded-full bg-gray-100">
                  <div
                    class="bg-primary h-full transition-all duration-300 ease-out" />
                </div>
                <span class="text-muted-foreground w-10 text-xs tabular-nums">
                  %
                </span>
              </div>
            </div>
          </div>
        </div>
</div>
