<template>
  <div class="flex flex-col gap-2"><div ondragenter="${handleDragEnter}" ondragleave="${handleDragLeave}" ondragover="${handleDragOver}" ondrop="${handleDrop}" data-dragging="${isDragging || undefined}" data-files="${files.length > 0 || undefined}" class="border-input data-[dragging=true]:bg-accent/50 has-[input:focus]:border-ring has-[input:focus]:ring-ring/50 relative flex min-h-52 flex-col items-center overflow-hidden rounded-xl border border-dashed p-4 transition-colors not-data-[files]:justify-center has-[input:focus]:ring-[3px]"><input class="sr-only" aria-label="Upload image file" /><!-- if files.length > 0 -->
<div class="flex w-full flex-col gap-3"><div class="flex items-center justify-between gap-2"><h3 class="truncate text-sm font-medium">Files (${files.length})</h3><div class="flex gap-2"><Button variant="outline" size="sm" on-click="${openFileDialog}"><UploadIcon class="-ms-0.5 size-3.5 opacity-60" aria-hidden="true" />Add files
                </Button><Button variant="outline" size="sm" on-click="${() => {
                    // Clear all progress tracking
                    setUploadProgress([])
                    clearFiles()
                  }}"><Trash2Icon class="-ms-0.5 size-3.5 opacity-60" aria-hidden="true" />Remove all
                </Button></div></div><div class="w-full space-y-2">${files.map((file) => {
                // Find the upload progress for this file once to avoid repeated lookups
                const fileProgress = uploadProgress.find((p) => p.fileId === file.id)
                const isUploading = fileProgress && !fileProgress.completed

                return (
                  <div
                    key={file.id}
                    data-uploading={isUploading || undefined}
                    className="bg-background flex flex-col gap-1 rounded-lg border p-2 pe-3 transition-opacity duration-300"
                  >
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-3 overflow-hidden in-data-[uploading=true]:opacity-50">
                        <div className="flex aspect-square size-10 shrink-0 items-center justify-center rounded border">
                          {getFileIcon(file)}
                        </div>
                        <div className="flex min-w-0 flex-col gap-0.5">
                          <p className="truncate text-[13px] font-medium">
                            {file.file instanceof File ? file.file.name : file.file.name}
                          </p>
                          <p className="text-muted-foreground text-xs">
                            {formatBytes(
                              file.file instanceof File ? file.file.size : file.file.size
                            )}
                          </p>
                        </div>
                      </div>
                      <Button
                        size="icon"
                        variant="ghost"
                        className="text-muted-foreground/80 hover:text-foreground -me-2 size-8 hover:bg-transparent"
                        onClick={() => {
                          handleFileRemoved(file.id)
                          removeFile(file.id)
                        }}
                        aria-label="Remove file"
                      >
                        <XIcon className="size-4" aria-hidden="true" />
                      </Button>
                    </div>

                    {/* Upload progress bar */}
                    {fileProgress &&
                      (() => {
                        const progress = fileProgress.progress || 0
                        const completed = fileProgress.completed || false

                        if (completed) return null

                        return (
                          <div className="mt-1 flex items-center gap-2">
                            <div className="h-1.5 w-full overflow-hidden rounded-full bg-gray-100">
                              <div
                                className="bg-primary h-full transition-all duration-300 ease-out"
                                style={{ width: `${progress}%` }}
                              />
                            </div>
                            <span className="text-muted-foreground w-10 text-xs tabular-nums">
                              {progress}%
                            </span>
                          </div>
                        )
                      })()}
                  </div>
                )
              })}</div></div>
<!-- else -->
<div class="flex flex-col items-center justify-center px-4 py-3 text-center"><div class="bg-background mb-2 flex size-11 shrink-0 items-center justify-center rounded-full border" aria-hidden="true"><ImageIcon class="size-4 opacity-60" /></div><p class="mb-1.5 text-sm font-medium">Drop your files here</p><p class="text-muted-foreground text-xs">Max ${maxFiles}files ∙ Up to ${maxSizeMB}MB
            </p><Button variant="outline" class="mt-4" on-click="${openFileDialog}"><UploadIcon class="-ms-1 opacity-60" aria-hidden="true" />Select images
            </Button></div>
<!-- endif --></div><!-- if errors.length > 0 -->
<div class="text-destructive flex items-center gap-1 text-xs" role="alert"><AlertCircleIcon class="size-3 shrink-0" /><span>${errors[0]}</span></div>
<!-- endif --><p aria-live="polite" role="region" class="text-muted-foreground mt-2 text-center text-xs">With simulated progress track ∙${' '}<a href="https://github.com/origin-space/originui/tree/main/docs/use-file-upload.md" class="hover:text-foreground underline" target="_blank">API
        </a></p></div>
</template>
