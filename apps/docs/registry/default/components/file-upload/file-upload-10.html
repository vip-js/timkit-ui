<template>
  <div class="flex flex-col gap-2"><div ondragenter="${handleDragEnter}" ondragleave="${handleDragLeave}" ondragover="${handleDragOver}" ondrop="${handleDrop}" data-dragging="${isDragging || undefined}" data-files="${files.length > 0 || undefined}" class="border-input data-[dragging=true]:bg-accent/50 has-[input:focus]:border-ring has-[input:focus]:ring-ring/50 flex min-h-56 flex-col items-center rounded-xl border border-dashed p-4 transition-colors not-data-[files]:justify-center has-[input:focus]:ring-[3px]"><input class="sr-only" aria-label="Upload files" /><!-- if files.length > 0 -->
<div class="flex w-full flex-col gap-3"><div class="flex items-center justify-between gap-2"><h3 class="truncate text-sm font-medium">Uploaded Files (${files.length})</h3><Button variant="outline" size="sm" on-click="${clearFiles}"><Trash2Icon class="-ms-0.5 size-3.5 opacity-60" aria-hidden="true" />Remove all
              </Button></div><div class="w-full space-y-2"><!-- Loop files -->
<div key="${file.id}" class="bg-background flex items-center justify-between gap-2 rounded-lg border p-2 pe-3"><div class="flex items-center gap-3 overflow-hidden"><div class="flex aspect-square size-10 shrink-0 items-center justify-center rounded border">${getFileIcon(file)}</div><div class="flex min-w-0 flex-col gap-0.5"><p class="truncate text-[13px] font-medium"><!-- if file.file instanceof File -->
${file.file.name}
<!-- else -->
${file.file.name}
<!-- endif --></p><p class="text-muted-foreground text-xs">${formatBytes(file.file instanceof File ? file.file.size : file.file.size)}</p></div></div><Button size="icon" variant="ghost" class="text-muted-foreground/80 hover:text-foreground -me-2 size-8 hover:bg-transparent" on-click="${() => removeFile(file.id)}" aria-label="Remove file"><XIcon class="size-4" aria-hidden="true" /></Button></div>
<!-- End Loop --><!-- if files.length < maxFiles -->
<Button variant="outline" class="mt-2 w-full" on-click="${openFileDialog}"><UploadIcon class="-ms-1 opacity-60" aria-hidden="true" />Add more
                </Button>
<!-- endif --></div></div>
<!-- else -->
<div class="flex flex-col items-center justify-center text-center"><div class="bg-background mb-2 flex size-11 shrink-0 items-center justify-center rounded-full border" aria-hidden="true"><FileIcon class="size-4 opacity-60" /></div><p class="mb-1.5 text-sm font-medium">Upload files</p><p class="text-muted-foreground text-xs">Max ${maxFiles}files ∙ Up to ${maxSize}MB
            </p><Button variant="outline" class="mt-4" on-click="${openFileDialog}"><UploadIcon class="-ms-1 opacity-60" aria-hidden="true" />Select files
            </Button></div>

<div class="text-destructive flex items-center gap-1 text-xs" role="alert"><AlertCircleIcon class="size-3 shrink-0" /><span>${errors[0]}</span></div>
<!-- endif --><p aria-live="polite" role="region" class="text-muted-foreground mt-2 text-center text-xs">Multiple files uploader w/ list inside ∙${' '}<a href="https://github.com/origin-space/originui/tree/main/docs/use-file-upload.md" class="hover:text-foreground underline">API
        </a></p></div>
</template>
