<label data-slot="switch-root" class="inline-flex items-center gap-3">
  <button
    type="button"
    role="switch"
    aria-checked="false"
    data-slot="switch"
    data-state="unchecked"
    class="inline-flex h-6 w-11 items-center rounded-full bg-input p-0.5 transition-colors"
  >
    <span
      data-slot="switch-thumb"
      data-state="unchecked"
      class="block h-5 w-5 rounded-full bg-background shadow transition-transform"
    ></span>
  </button>
  <input type="checkbox" class="sr-only" />
  <span class="text-sm font-medium">Enable release preview</span>
</label>
