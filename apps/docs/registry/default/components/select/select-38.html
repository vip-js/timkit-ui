<div class="*:not-first:mt-2">
      <label for="select-38-id">Options with avatar</label>
      <select defaultValue="1">
        <select-trigger id="select-38-id"
          class="ps-2 [&>span]:flex [&>span]:items-center [&>span]:gap-2 [&>span_img]:shrink-0"
        >
          <select-value placeholder="Select framework" />
        </select-trigger>
        <select-content class="[&_*[role=option]]:ps-2 [&_*[role=option]]:pe-8 [&_*[role=option]>span]:start-auto [&_*[role=option]>span]:end-2 [&_*[role=option]>span]:flex [&_*[role=option]>span]:items-center [&_*[role=option]>span]:gap-2">
          <select-group>
            <select-label class="ps-2">Impersonate user</select-label>
            <select-item value="1">
              <img
                class="size-5 rounded"
                src="/avatar-20-01.jpg"
                alt="Frank Allison" width="20" height="20"
              />
              <span class="truncate">Jenny Hamilton</span>
            </select-item>
            <select-item value="2">
              <img
                class="size-5 rounded"
                src="/avatar-20-02.jpg"
                alt="Xavier Guerra" width="20" height="20"
              />
              <span class="truncate">Paul Smith</span>
            </select-item>
            <select-item value="3">
              <img
                class="size-5 rounded"
                src="/avatar-20-03.jpg"
                alt="Anne Kelley" width="20" height="20"
              />
              <span class="truncate">Luna Wyen</span>
            </select-item>
          </select-group>
        </select-content>
      </select>
    </div>
