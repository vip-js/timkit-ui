<div class="timui-html-demo space-y-4 p-4">
<div class="*:not-first:mt-2">
    <label data-slot="label">Listbox with option groups</label>
    <div class="border-input overflow-hidden rounded-md border">
      <div data-slot="list-box"
       
        aria-label="Select some foods"
        selectionMode="multiple">
        <div data-slot="list-box-section">
          <div data-slot="header">Veggies
          <div data-slot="list-box-item"
            id="lettuce">
            Lettuce
          
          <div data-slot="list-box-item"
            id="tomato">
            Tomato
          
          <div data-slot="list-box-item"
            id="onion">
            Onion
          
        

        <hr data-slot="separator">

        <div data-slot="list-box-section">
          <div data-slot="header">Protein
          <div data-slot="list-box-item"
            id="ham">
            Ham
          
          <div data-slot="list-box-item"
            id="tuna">
            Tuna
          
          <div data-slot="list-box-item"
            id="tofu">
            Tofu
          
        

        <hr data-slot="separator">

        <div data-slot="list-box-section">
          <div data-slot="header">Condiments
          <div data-slot="list-box-item"
            id="mayo">
            Mayonaise
          
          <div data-slot="list-box-item"
            id="mustard">
            Mustard
          
          <div data-slot="list-box-item"
            id="ranch">
            Ranch
          
        
      
    </div>

    <p class="text-muted-foreground mt-2 text-xs" role="region" aria-live="polite">
      Built with
      <a
        class="hover:text-foreground underline"
        href="https://zagjs.com/"
        target="_blank"
        rel="noopener nofollow">
        Zag.js
      </a>
    </p>
  </div>
</div>
