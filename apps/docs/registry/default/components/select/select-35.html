<div class="timui-html-demo space-y-4 p-4">
<div class="*:not-first:mt-2">
    <label data-slot="label" for="select-35">Options with icon and right indicator</label>
    <select data-slot="select">
      <button type="button" data-slot="select-trigger" id="select-35" class="[&>span_svg]:text-muted-foreground/80 [&>span]:flex [&>span]:items-center [&>span]:gap-2 [&>span_svg]:shrink-0">
        <span data-slot="select-value" placeholder="Select framework"></span>
      </button>
      <div data-slot="select-content" class="[&_*[role=option]>span>svg]:text-muted-foreground/80 [&_*[role=option]]:ps-2 [&_*[role=option]]:pe-8 [&_*[role=option]>span]:start-auto [&_*[role=option]>span]:end-2 [&_*[role=option]>span]:flex [&_*[role=option]>span]:items-center [&_*[role=option]>span]:gap-2 [&_*[role=option]>span>svg]:shrink-0">
        <option data-slot="select-item" value="1">
          <span aria-hidden="true" size="16" aria-hidden="true">
          <span class="truncate">React</span>
        </option>
        <option data-slot="select-item" value="2">
          <span aria-hidden="true" size="16" aria-hidden="true">
          <span class="truncate">Next.js</span>
        </option>
        <option data-slot="select-item" value="3">
          <span aria-hidden="true" size="16" aria-hidden="true">
          <span class="truncate">Gatsby</span>
        </option>
      </div>
    </select>
  </div>
</div>
