<template>
  <div class="*:not-first:mt-2"><Label htmlfor="${id}">Timezone select with search</Label><Popover open="${open}" on-open-change="${setOpen}"><PopoverTrigger aschild><Button id="${id}" variant="outline" role="combobox" aria-expanded="${open}" class="bg-background hover:bg-background border-input w-full justify-between px-3 font-normal outline-offset-0 outline-none focus-visible:outline-[3px]"><span class="${cn('truncate', !value && 'text-muted-foreground')}"><!-- if value -->
${formattedTimezones.find((timezone) => timezone.value === value)?.label}
<!-- else -->
${'Select timezone'}
<!-- endif --></span><ChevronDownIcon size="${16}" class="text-muted-foreground/80 shrink-0" aria-hidden="true" /></Button></PopoverTrigger><PopoverContent class="border-input w-full min-w-[var(--radix-popper-anchor-width)] p-0" align="start"><Command filter="${(value, search) => {
              const normalizedValue = value.toLowerCase()
              const normalizedSearch = search.toLowerCase().replace(/\s+/g, '')
              return normalizedValue.includes(normalizedSearch) ? 1 : 0
            }}"><CommandInput placeholder="Search timezone..." /><CommandList><CommandEmpty>No timezone found.</CommandEmpty><CommandGroup><!-- Loop formattedTimezones -->
<CommandItem key="${itemValue}" value="${itemValue}" onselect="${(currentValue) => {
                      const val = currentValue as string
                      setValue(val === value ? '' : val)
                      setOpen(false)
                    }}">${label}<!-- if value === itemValue -->
<CheckIcon size="${16}" class="ml-auto" />
<!-- endif --></CommandItem>
<!-- End Loop --></CommandGroup></CommandList></Command></PopoverContent></Popover></div>
</template>
