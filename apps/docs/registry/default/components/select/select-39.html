<div class="*:not-first:mt-2">
      <label for="select-39-id">Options with placeholder avatar</label>
      <select defaultValue="1">
        <select-trigger id="select-39-id"
          class="ps-2 [&>span]:flex [&>span]:items-center [&>span]:gap-2 [&>span_[data-square]]:shrink-0"
        >
          <select-value placeholder="Select framework" />
        </select-trigger>
        <select-content class="[&_*[role=option]]:ps-2 [&_*[role=option]]:pe-8 [&_*[role=option]>span]:start-auto [&_*[role=option]>span]:end-2 [&_*[role=option]>span]:flex [&_*[role=option]>span]:items-center [&_*[role=option]>span]:gap-2">
          <select-group>
            <select-label class="ps-2">Impersonate user</select-label>
            <select-item value="1">
              <square class="bg-indigo-400/20 text-indigo-500">F</square>
              <span class="truncate">Frank Morris</span>
            </select-item>
            <select-item value="2">
              <square class="bg-purple-400/20 text-purple-500">X</square>
              <span class="truncate">Xavier Guerra</span>
            </select-item>
            <select-item value="3">
              <square class="bg-rose-400/20 text-rose-500">A</square>
              <span class="truncate">Anne Kelley</span>
            </select-item>
          </select-group>
        </select-content>
      </select>
    </div>
