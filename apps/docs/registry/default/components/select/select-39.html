<div class="timui-html-demo space-y-4 p-4">
<div class="*:not-first:mt-2">
    <label data-slot="label" for="select-39">Options with placeholder avatar</label>
    <select data-slot="select">
      <button type="button" data-slot="select-trigger" id="select-39" class="ps-2 [&>span]:flex [&>span]:items-center [&>span]:gap-2 [&>span_[data-square]]:shrink-0">
        <span data-slot="select-value" placeholder="Select framework"></span>
      </button>
      <div data-slot="select-content" class="[&_*[role=option]]:ps-2 [&_*[role=option]]:pe-8 [&_*[role=option]>span]:start-auto [&_*[role=option]>span]:end-2 [&_*[role=option]>span]:flex [&_*[role=option]>span]:items-center [&_*[role=option]>span]:gap-2">
        <optgroup>
          <label>Impersonate user</label>
          <option data-slot="select-item" value="1">
            <span data-square aria-hidden="true">F</span>
            <span class="truncate">Frank Morris</span>
          </option>
          <option data-slot="select-item" value="2">
            <span data-square aria-hidden="true">X</span>
            <span class="truncate">Xavier Guerra</span>
          </option>
          <option data-slot="select-item" value="3">
            <span data-square aria-hidden="true">A</span>
            <span class="truncate">Anne Kelley</span>
          </option>
        </optgroup>
      </div>
    </select>
  </div>
</div>
