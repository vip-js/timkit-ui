<template>
  <div class="*:not-first:mt-2"><Label htmlfor="${id}">Options with icon and number</Label><Popover open="${open}" on-open-change="${setOpen}"><PopoverTrigger aschild><Button id="${id}" variant="outline" role="combobox" aria-expanded="${open}" class="bg-background hover:bg-background border-input w-full justify-between px-3 font-normal outline-offset-0 outline-none focus-visible:outline-[3px]"><!-- if value -->
<span class="flex min-w-0 items-center gap-2">${(() => {
                  const selectedItem = items.find((item) => item.value === value)
                  if (selectedItem) {
                    const Icon = selectedItem.icon
                    return <Icon className="text-muted-foreground size-4" />
                  }
                  return null
                })()}<span class="truncate">${items.find((item) => item.value === value)?.label}</span></span>
<!-- else -->
<span class="text-muted-foreground">Select service category</span>
<!-- endif --><ChevronDownIcon size="${16}" class="text-muted-foreground/80 shrink-0" aria-hidden="true" /></Button></PopoverTrigger><PopoverContent class="border-input w-full min-w-[var(--radix-popper-anchor-width)] p-0" align="start"><Command><CommandInput placeholder="Search services..." /><CommandList><CommandEmpty>No service found.</CommandEmpty><CommandGroup><!-- Loop items -->
<CommandItem key="${item.value}" value="${item.value}" onselect="${(currentValue) => {
                      const val = currentValue as string
                      setValue(val === value ? '' : val)
                      setOpen(false)
                    }}" class="flex items-center justify-between"><div class="flex items-center gap-2"><item.icon class="text-muted-foreground size-4" />${item.label}</div><span class="text-muted-foreground text-xs">${item.number.toLocaleString()}</span></CommandItem>
<!-- End Loop --></CommandGroup></CommandList></Command></PopoverContent></Popover></div>
</template>
