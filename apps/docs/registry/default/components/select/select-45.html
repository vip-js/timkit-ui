<div class="timui-html-demo space-y-4 p-4">
<div class="*:not-first:mt-2">
    <label data-slot="label">Options with icon and number</label>

    <div data-slot="popover">
      <button type="button" data-slot="popover-trigger">
        <button type="button" data-slot="button" class="bg-background hover:bg-background border-input w-full justify-between px-3 font-normal outline-offset-0 outline-none focus-visible:outline-[3px] inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
          variant="outline"
          role="combobox">
          <span class="flex min-w-0 items-center gap-2">
            <component class="text-muted-foreground size-4" />
            <span class="truncate"></span>
          </span>
          <span class="text-muted-foreground">Select service category</span>

          <span aria-hidden="true" size="16" aria-hidden="true">
        </button>
      </button>

      <div data-slot="popover-content" align="start">
        <div role="listbox">
          <input type="search" class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" placeholder="Search services...">
          <ul>
            <p>No service found.</p>
            <li>
              <button type="button" role="option">
                <div class="flex items-center gap-2">
                  <component class="text-muted-foreground size-4" />
                  Example
                </div>
                <span class="text-muted-foreground text-xs"></span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
