<div class="timui-html-demo space-y-4 p-4">
<div class="*:not-first:mt-2">
    <label data-slot="label" for="select-32">Status select</label>
    <select data-slot="select">
      <button type="button" data-slot="select-trigger" id="select-32" class="[&>span]:flex [&>span]:items-center [&>span]:gap-2 [&>span_svg]:shrink-0">
        <span data-slot="select-value" placeholder="Select status"></span>
      </button>
      <div data-slot="select-content" class="[&_*[role=option]>span>svg]:text-muted-foreground/80 [&_*[role=option]]:ps-2 [&_*[role=option]]:pe-8 [&_*[role=option]>span]:start-auto [&_*[role=option]>span]:end-2 [&_*[role=option]>span]:flex [&_*[role=option]>span]:items-center [&_*[role=option]>span]:gap-2 [&_*[role=option]>span>svg]:shrink-0">
        <option data-slot="select-item" value="1">
          <span class="flex items-center gap-2">
            <svg width="8" height="8" fill="currentColor" viewBox="0 0 8 8" class="text-emerald-600" aria-hidden="true"><circle cx="4" cy="4" r="4" /></svg>
            <span class="truncate">Completed</span>
          </span>
        </option>
        <option data-slot="select-item" value="2">
          <span class="flex items-center gap-2">
            <svg width="8" height="8" fill="currentColor" viewBox="0 0 8 8" class="text-blue-500" aria-hidden="true"><circle cx="4" cy="4" r="4" /></svg>
            <span class="truncate">In Progress</span>
          </span>
        </option>
        <option data-slot="select-item" value="3">
          <span class="flex items-center gap-2">
            <svg width="8" height="8" fill="currentColor" viewBox="0 0 8 8" class="text-amber-500" aria-hidden="true"><circle cx="4" cy="4" r="4" /></svg>
            <span class="truncate">Pending</span>
          </span>
        </option>
        <option data-slot="select-item" value="4">
          <span class="flex items-center gap-2">
            <svg width="8" height="8" fill="currentColor" viewBox="0 0 8 8" class="text-gray-500" aria-hidden="true"><circle cx="4" cy="4" r="4" /></svg>
            <span class="truncate">Cancelled</span>
          </span>
        </option>
        <option data-slot="select-item" value="5">
          <span class="flex items-center gap-2">
            <svg width="8" height="8" fill="currentColor" viewBox="0 0 8 8" class="text-red-500" aria-hidden="true"><circle cx="4" cy="4" r="4" /></svg>
            <span class="truncate">Failed</span>
          </span>
        </option>
      </div>
    </select>
  </div>
</div>
