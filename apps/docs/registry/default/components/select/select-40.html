<div class="*:not-first:mt-2">
      <label for="select-40-id">Options with portrait</label>
      <select defaultValue="1">
        <select-trigger id="select-40-id"
          class="h-auto ps-2 text-left [&>span]:flex [&>span]:items-center [&>span]:gap-2 [&>span_img]:shrink-0"
        >
          <select-value placeholder="Choose a plan" />
        </select-trigger>
        <select-content class="[&_*[role=option]]:ps-2 [&_*[role=option]]:pe-8 [&_*[role=option]>span]:start-auto [&_*[role=option]>span]:end-2">
          <select-item value="1">
            <span class="flex items-center gap-2">
              <img
                class="rounded-full"
                src="/avatar-40-01.jpg"
                alt="Jenny Hamilton" width="40" height="40"
              />
              <span>
                <span class="block font-medium">Jenny Hamilton</span>
                <span class="text-muted-foreground mt-0.5 block text-xs">@jennycodes</span>
              </span>
            </span>
          </select-item>
          <select-item value="2">
            <span class="flex items-center gap-2">
              <img
                class="rounded-full"
                src="/avatar-40-02.jpg"
                alt="Paul Smith" width="40" height="40"
              />
              <span>
                <span class="block font-medium">Paul Smith</span>
                <span class="text-muted-foreground mt-0.5 block text-xs">@paulsmith</span>
              </span>
            </span>
          </select-item>
          <select-item value="3">
            <span class="flex items-center gap-2">
              <img
                class="rounded-full"
                src="/avatar-40-03.jpg"
                alt="Luna Wyen" width="40" height="40"
              />
              <span>
                <span class="block font-medium">Luna Wyen</span>
                <span class="text-muted-foreground mt-0.5 block text-xs">@wyen.luna</span>
              </span>
            </span>
          </select-item>
        </select-content>
      </select>
    </div>
