<div class="timui-html-demo space-y-4 p-4">
<div class="*:not-first:mt-2">
    <label data-slot="label" for="number-Example">Card Number</label>
    <div class="relative">
      <input data-slot="input" class="peer ps-9 [direction:inherit] flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm" id="number-Example"
       
        inputmode="numeric"
        autocomplete="cc-number">
      <div class="text-muted-foreground/80 pointer-events-none absolute inset-y-0 start-0 flex items-center justify-center ps-3 peer-disabled:opacity-50">
        <span aria-hidden="true" size="16" aria-hidden="true">
      </div>
    </div>
    <p class="text-muted-foreground mt-2 text-xs" role="region" aria-live="polite">
      Built with
      <a
        class="hover:text-foreground underline"
        href="https://github.com/medipass/react-payment-inputs"
        target="_blank"
        rel="noopener nofollow">
        React Payment Inputs
      </a>
    </p>
  </div>
</div>
