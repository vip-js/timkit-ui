<div class="timui-html-demo space-y-4 p-4">
<div class="*:not-first:mt-2">
    <label data-slot="label">Number input with plus/minus buttons</label>
    <div class="border-input bg-background relative inline-flex h-9 w-full items-center overflow-hidden rounded-md border text-sm shadow-xs">
      <button type="button" data-slot="button" class="h-full rounded-none border-r inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
        type="button"
        size="icon"
        variant="ghost"
       
        aria-label="Decrease value">
        <span aria-hidden="true" size="16" aria-hidden="true">
      </button>
      <input data-slot="input" class="h-full rounded-none border-0 text-center tabular-nums shadow-none flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm"
        type="number"
        min="0">
      <button type="button" data-slot="button" class="h-full rounded-none border-l inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground"
        type="button"
        size="icon"
        variant="ghost"
       
        aria-label="Increase value">
        <span aria-hidden="true" size="16" aria-hidden="true">
      </button>
    </div>
    <p class="text-muted-foreground mt-2 text-xs" role="region" aria-live="polite">
      Built with TimUI atomic components
    </p>
  </div>
</div>
