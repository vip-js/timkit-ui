<div class="timui-html-demo space-y-4 p-4">
<div data-slot="date-range-picker">
    <label data-slot="label">Date range picker (unavailable dates)</label>

    <div class="flex">
      <div data-slot="group">
        <span aria-hidden="true" data-slot="start" unstyled>
        <span aria-hidden="true" class="text-muted-foreground/70 px-2">-</span>
        <span aria-hidden="true" data-slot="end" unstyled>
      

      <div data-slot="date-range-picker-trigger">
        <span aria-hidden="true" size="16">
      
    </div>

    <div data-slot="date-range-picker-content">
      <div class="max-h-[inherit] overflow-auto p-2">
        <span aria-hidden="true">
      </div>
    

    <p class="text-destructive mt-1 text-xs" role="alert">
      
    </p>

    <p class="text-muted-foreground mt-2 text-xs" role="region" aria-live="polite">
      Built with
      <a
        class="hover:text-foreground underline"
        href="https://react-spectrum.adobe.com/react-aria/DateRangePicker.html"
        target="_blank"
        rel="noopener nofollow">
        React Aria
      </a>
    </p>
</div>
