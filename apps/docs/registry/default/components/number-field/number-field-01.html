<div data-slot="number-field" class="flex items-center gap-2" aria-label="Quantity">
  <button type="button" data-slot="number-field-decrement" aria-label="Decrease quantity">−</button>
  <input data-slot="number-field-input" type="number" role="spinbutton" aria-label="Quantity" min="0" max="100" value="20" />
  <button type="button" data-slot="number-field-increment" aria-label="Increase quantity">+</button>
</div>
