<template>
  <div class="space-y-3"><div class="flex items-center justify-between gap-2"><Label>Temperature</Label><div class="flex items-center gap-1"><TooltipProvider delayduration="${0}"><Tooltip><TooltipTrigger aschild><Button size="icon" variant="ghost" class="${cn(
                    'size-7 transition-opacity',
                    showReset ? 'opacity-100' : 'opacity-0'
                  )}" aria-label="Reset" on-click="${resetToDefault}"><RotateCcwIcon size="${16}" aria-hidden="true" /></Button></TooltipTrigger><TooltipContent class="px-2 py-1 text-xs">Reset to default</TooltipContent></Tooltip></TooltipProvider><Input class="h-7 w-12 px-2 py-0" type="text" inputmode="decimal" value="${inputValues[0]}" onchange="${(e) => handleInputChange(e, 0)}" onblur="${() => validateAndUpdateValue(inputValues[0] ?? '', 0)}" onkeydown="${(e) => {
              if (e.key === 'Enter') {
                validateAndUpdateValue(inputValues[0] ?? '', 0)
              }
            }}" aria-label="Enter value" /></div></div><div class="flex items-center gap-4"><Slider class="grow" value="${sliderValue}" on-value-change="${handleSliderChange}" min="${minValue}" max="${maxValue}" step="${0.01}" aria-label="Temperature" /></div></div>
</template>
