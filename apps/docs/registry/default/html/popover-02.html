<template>
  <Popover><PopoverTrigger aschild><Button size="icon" variant="outline" class="relative" aria-label="Open notifications"><BellIcon size="${16}" aria-hidden="true" /><!-- if unreadCount > 0 -->
<Badge class="absolute -top-2 left-full min-w-5 -translate-x-1/2 px-1">${unreadCount > 99 ? '99+' : unreadCount}</Badge>
<!-- endif --></Button></PopoverTrigger><PopoverContent class="w-80 p-1"><div class="flex items-baseline justify-between gap-4 px-3 py-2"><div class="text-sm font-semibold">Notifications</div><!-- if unreadCount > 0 -->
<button class="text-xs font-medium hover:underline" on-click="${handleMarkAllAsRead}">Mark all as read
            </button>
<!-- endif --></div><div role="separator" aria-orientation="horizontal" class="bg-border -mx-1 my-1 h-px"></div><!-- Loop notifications -->
<div key="${notification.id}" class="hover:bg-accent rounded-md px-3 py-2 text-sm transition-colors"><div class="relative flex items-start pe-3"><div class="flex-1 space-y-1"><button class="text-foreground/80 text-left after:absolute after:inset-0" on-click="${() => handleNotificationClick(notification.id)}"><span class="text-foreground font-medium hover:underline">${notification.user}</span>${' '}${notification.action}${' '}<span class="text-foreground font-medium hover:underline">${notification.target}</span>.
                </button><div class="text-muted-foreground text-xs">${notification.timestamp}</div></div><!-- if notification.unread -->
<div class="absolute end-0 self-center"><span class="sr-only">Unread</span><Dot /></div>
<!-- endif --></div></div>
<!-- End Loop --></PopoverContent></Popover>
</template>
