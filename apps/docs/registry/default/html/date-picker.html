<template>
  <Popover><PopoverTrigger aschild><Button variant="outline" size="sm" class="group bg-background border-input w-full justify-between px-3 text-sm font-normal outline-offset-0 outline-none focus-visible:outline-[3px]"><CalendarIcon size="${16}" class="text-muted-foreground/80 -ms-1 shrink-0 transition-colors" aria-hidden="true" /><span class="${cn('truncate', !date && 'font-medium')}">${date?.from ? (
              date.to ? (
                <>
                  {format(date.from, 'LLL dd, y')} - {format(date.to, 'LLL dd, y')}
                </>
              ) : (
                format(date.from, 'LLL dd, y')
              )
            ) : (
              'Date'
            )}</span></Button></PopoverTrigger><PopoverContent class="w-auto p-2" align="start"><Calendar mode="range" selected="${date}" onselect="${setDate}" /></PopoverContent></Popover>
</template>
