<template>
  <Pagination><PaginationContent><PaginationItem><PaginationLink class="aria-disabled:pointer-events-none aria-disabled:opacity-50" href="${currentPage === 1 ? undefined : `#/page/${currentPage - 1}`}" aria-label="Go to first page" aria-disabled="${currentPage === 1 ? true : undefined}" role="${currentPage === 1 ? 'link' : undefined}"><ChevronFirstIcon size="${16}" aria-hidden="true" /></PaginationLink></PaginationItem><PaginationItem><PaginationLink class="aria-disabled:pointer-events-none aria-disabled:opacity-50" href="${currentPage === 1 ? undefined : `#/page/${currentPage - 1}`}" aria-label="Go to previous page" aria-disabled="${currentPage === 1 ? true : undefined}" role="${currentPage === 1 ? 'link' : undefined}"><ChevronLeftIcon size="${16}" aria-hidden="true" /></PaginationLink></PaginationItem><!-- if showLeftEllipsis -->
<PaginationItem><PaginationEllipsis /></PaginationItem>
<!-- endif --><!-- Loop pages -->
<PaginationItem key="${page}"><PaginationLink href="${`#/page/${page}`}" isactive="${page === currentPage}">${page}</PaginationLink></PaginationItem>
<!-- End Loop --><!-- if showRightEllipsis -->
<PaginationItem><PaginationEllipsis /></PaginationItem>
<!-- endif --><PaginationItem><PaginationLink class="aria-disabled:pointer-events-none aria-disabled:opacity-50" href="${currentPage === totalPages ? undefined : `#/page/${currentPage + 1}`}" aria-label="Go to next page" aria-disabled="${currentPage === totalPages ? true : undefined}" role="${currentPage === totalPages ? 'link' : undefined}"><ChevronRightIcon size="${16}" aria-hidden="true" /></PaginationLink></PaginationItem><PaginationItem><PaginationLink class="aria-disabled:pointer-events-none aria-disabled:opacity-50" href="${currentPage === totalPages ? undefined : `#/page/${totalPages}`}" aria-label="Go to last page" aria-disabled="${currentPage === totalPages ? true : undefined}" role="${currentPage === totalPages ? 'link' : undefined}"><ChevronLastIcon size="${16}" aria-hidden="true" /></PaginationLink></PaginationItem></PaginationContent></Pagination>
</template>
