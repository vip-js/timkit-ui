<template>
  <div class="*:not-first:mt-2"><Label htmlfor="${id}">Options with flag and search</Label><Popover open="${open}" on-open-change="${setOpen}"><PopoverTrigger aschild><Button id="${id}" variant="outline" role="combobox" aria-expanded="${open}" class="bg-background hover:bg-background border-input w-full justify-between px-3 font-normal outline-offset-0 outline-none focus-visible:outline-[3px]">${value ? (
              <span className="flex min-w-0 items-center gap-2">
                <span className="text-lg leading-none">
                  {
                    countries
                      .map((group) => group.items.find((item) => item.value === value))
                      .filter(Boolean)[0]?.flag
                  }
                </span>
                <span className="truncate">{value}</span>
              </span>
            ) : (
              <span className="text-muted-foreground">Select country</span>
            )}<ChevronDownIcon size="${16}" class="text-muted-foreground/80 shrink-0" aria-hidden="true" /></Button></PopoverTrigger><PopoverContent class="border-input w-full min-w-[var(--radix-popper-anchor-width)] p-0" align="start"><Command><CommandInput placeholder="Search country..." /><CommandList><CommandEmpty>No country found.</CommandEmpty><!-- Loop countries -->
<Fragment key="${group.continent}"><CommandGroup heading="${group.continent}"><!-- Loop group.items -->
<CommandItem key="${country.value}" value="${country.value}" onselect="${(currentValue) => {
                          const val = currentValue as string
                          setValue(val === value ? '' : val)
                          setOpen(false)
                        }}"><span class="text-lg leading-none">${country.flag}</span>${country.value}<!-- if value === country.value -->
<CheckIcon size="${16}" class="ml-auto" />
<!-- endif --></CommandItem>
<!-- End Loop --></CommandGroup></Fragment>
<!-- End Loop --></CommandList></Command></PopoverContent></Popover></div>
</template>
