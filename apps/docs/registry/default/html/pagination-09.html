<template>
  <div class="flex items-center justify-between gap-3"><p class="text-muted-foreground flex-1 text-sm whitespace-nowrap" aria-live="polite">Page <span class="text-foreground">${currentPage}</span>of${' '}<span class="text-foreground">${totalPages}</span></p><div class="grow"><Pagination><PaginationContent><PaginationItem><PaginationLink class="aria-disabled:pointer-events-none aria-disabled:opacity-50" href="${currentPage === 1 ? undefined : `#/page/${currentPage - 1}`}" aria-label="Go to previous page" aria-disabled="${currentPage === 1 ? true : undefined}" role="${currentPage === 1 ? 'link' : undefined}"><ChevronLeftIcon size="${16}" aria-hidden="true" /></PaginationLink></PaginationItem><!-- if showLeftEllipsis -->
<PaginationItem><PaginationEllipsis /></PaginationItem>
<!-- endif --><!-- Loop pages -->
<PaginationItem key="${page}"><PaginationLink href="${`#/page/${page}`}" isactive="${page === currentPage}">${page}</PaginationLink></PaginationItem>
<!-- End Loop --><!-- if showRightEllipsis -->
<PaginationItem><PaginationEllipsis /></PaginationItem>
<!-- endif --><PaginationItem><PaginationLink class="aria-disabled:pointer-events-none aria-disabled:opacity-50" href="${currentPage === totalPages ? undefined : `#/page/${currentPage + 1}`}" aria-label="Go to next page" aria-disabled="${currentPage === totalPages ? true : undefined}" role="${currentPage === totalPages ? 'link' : undefined}"><ChevronRightIcon size="${16}" aria-hidden="true" /></PaginationLink></PaginationItem></PaginationContent></Pagination></div><div class="flex flex-1 justify-end"><Select default-value="10" aria-label="Results per page"><SelectTrigger id="results-per-page" class="w-fit whitespace-nowrap"><SelectValue placeholder="Select number of results" /></SelectTrigger><SelectContent><SelectItem value="10">10 / page</SelectItem><SelectItem value="20">20 / page</SelectItem><SelectItem value="50">50 / page</SelectItem><SelectItem value="100">100 / page</SelectItem></SelectContent></Select></div></div>
</template>
