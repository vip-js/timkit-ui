<template>
  <Table><TableHeader><TableRow class="*:border-border border-y-0 hover:bg-transparent [&>:not(:last-child)]:border-r"><TableCell></TableCell><TableHead class="border-b text-center" colspan="${5}"><MonitorIcon class="inline-flex" size="${16}" aria-hidden="true" /><span class="sr-only">Desktop browsers</span></TableHead><TableHead class="border-b text-center" colspan="${5}"><SmartphoneIcon class="inline-flex" size="${16}" aria-hidden="true" /><span class="sr-only">Mobile browsers</span></TableHead></TableRow></TableHeader><TableHeader><TableRow class="*:border-border hover:bg-transparent [&>:not(:last-child)]:border-r"><TableCell></TableCell><!-- Loop items[0].desktop -->
<TableHead key="${browser.name}" class="text-foreground h-auto py-3 align-bottom"><span class="relative left-[calc(50%-.5rem)] block rotate-180 leading-4 whitespace-nowrap [text-orientation:sideways] [writing-mode:vertical-rl]">${browser.name}</span></TableHead>
<!-- End Loop --><!-- Loop items[0].mobile -->
<TableHead key="${browser.name}" class="text-foreground h-auto py-3 align-bottom"><span class="relative left-[calc(50%-.5rem)] block rotate-180 leading-4 whitespace-nowrap [text-orientation:sideways] [writing-mode:vertical-rl]">${browser.name}</span></TableHead>
<!-- End Loop --></TableRow></TableHeader><TableBody><!-- Loop items -->
<TableRow key="${item.feature}" class="*:border-border [&>:not(:last-child)]:border-r"><TableHead class="text-foreground font-medium">${item.feature}</TableHead><!-- Loop [...item.desktop, ...item.mobile] -->
<TableCell key="${`${browser.name}-${index}`}" class="space-y-1 text-center">${browser.supported ? (
                  <CheckIcon
                    className="inline-flex stroke-emerald-600"
                    size={16}
                    aria-hidden="true"
                  />
                ) : (
                  <XIcon className="inline-flex stroke-red-600" size={16} aria-hidden="true" />
                )}<span class="sr-only">${browser.supported ? 'Supported' : 'Not supported'}</span><div class="text-muted-foreground text-xs font-medium">${browser.version}</div></TableCell>
<!-- End Loop --></TableRow>
<!-- End Loop --></TableBody></Table>
</template>
