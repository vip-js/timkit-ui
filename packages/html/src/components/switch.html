<label data-slot="switch-root" class="inline-flex items-center">
    <button type="button" role="switch" data-slot="switch" data-state="unchecked" aria-checked="false" class="peer inline-flex h-6 w-11 shrink-0 cursor-pointer items-center rounded-full border-2 border-transparent transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:cursor-not-allowed disabled:opacity-50 data-[state&#x3D;checked]:bg-primary data-[state&#x3D;unchecked]:bg-input">
        <span data-slot="switch-thumb" data-state="unchecked" class="pointer-events-none block h-5 w-5 rounded-full bg-background shadow-lg ring-0 transition-transform data-[state&#x3D;checked]:translate-x-5 data-[state&#x3D;unchecked]:translate-x-0"></span>
    </button>
    <input type="checkbox"
        style="border: 0px; clip: rect(0px, 0px, 0px, 0px); clip-path: inset(50%); height: 1px; margin: -1px; overflow: hidden; padding: 0px; position: absolute; width: 1px; white-space: nowrap; word-wrap: normal;" />
</label>
