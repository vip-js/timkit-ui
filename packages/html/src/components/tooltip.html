<div data-slot="tooltip-root" data-state="closed" class="relative inline-flex">
  <button
    data-slot="tooltip-trigger"
    type="button"
    class="rounded-md border px-3 py-2 text-sm"
  >
    Hover for details
  </button>
  <div
    data-slot="tooltip-content"
    data-state="closed"
    hidden
    class="data-[state&#x3D;open]:animate-in data-[state&#x3D;closed]:animate-out data-[state&#x3D;closed]:fade-out-0 data-[state&#x3D;open]:fade-in-0 data-[state&#x3D;closed]:zoom-out-95 data-[state&#x3D;open]:zoom-in-95 data-[side&#x3D;bottom]:slide-in-from-top-2 data-[side&#x3D;left]:slide-in-from-right-2 data-[side&#x3D;right]:slide-in-from-left-2 data-[side&#x3D;top]:slide-in-from-bottom-2 z-50 overflow-hidden rounded-md border bg-popover px-3 py-1.5 text-xs text-popover-foreground shadow-md absolute left-1/2 top-full z-50 mt-2 -translate-x-1/2 whitespace-nowrap"
  >
    Tooltip content
  </div>
</div>
