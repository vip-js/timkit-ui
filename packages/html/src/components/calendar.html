<div data-slot="calendar" class="w-full border-collapse space-y-1">
  <p role="status">2026-03-03</p>
  <div class="relative flex size-9 items-center justify-center whitespace-nowrap rounded-md p-0 text-foreground group-[[data-selected]:not(.range-middle)]:[transition-property:color,background-color,border-radius,box-shadow] group-[[data-selected]:not(.range-middle)]:duration-150 group-data-disabled:pointer-events-none focus-visible:z-10 hover:not-in-data-selected:bg-accent group-data-selected:bg-primary hover:not-in-data-selected:text-foreground group-data-selected:text-primary-foreground group-data-disabled:text-foreground/30 group-data-disabled:line-through group-data-outside:text-foreground/30 group-data-selected:group-data-outside:text-primary-foreground outline-none focus-visible:ring-ring/50 focus-visible:ring-[3px] group-[.range-start:not(.range-end)]:rounded-e-none group-[.range-end:not(.range-start)]:rounded-s-none group-[.range-middle]:rounded-none group-[.range-middle]:group-data-selected:bg-accent group-[.range-middle]:group-data-selected:text-foreground">
    <button type="button" aria-label="Switch to previous month" class="rounded-sm px-2 py-1 hover:bg-accent">&lt;</button>
    <div id="calendar-caption" class="text-sm font-medium">March 2026</div>
    <button type="button" aria-label="Switch to next month" class="rounded-sm px-2 py-1 hover:bg-accent">&gt;</button>
  </div>
  <div role="grid" tabindex="-1" aria-labelledby="calendar-caption">
  <div class="grid grid-cols-7 gap-1 text-center text-xs text-muted-foreground" role="row">
    <span role="columnheader">Su</span><span role="columnheader">Mo</span><span role="columnheader">Tu</span><span role="columnheader">We</span><span role="columnheader">Th</span><span role="columnheader">Fr</span><span role="columnheader">Sa</span>
  </div>
  <div class="mt-2 grid grid-cols-7 gap-1 text-center text-sm" role="row">
    <button type="button" role="gridcell" aria-selected="false" tabindex="-1" aria-label="March 1, 2026" class="h-8 rounded-sm hover:bg-accent">1</button>
    <button type="button" role="gridcell" aria-selected="false" tabindex="-1" aria-label="March 2, 2026" class="h-8 rounded-sm hover:bg-accent">2</button>
    <button type="button" role="gridcell" aria-selected="true" tabindex="0" aria-label="March 3, 2026" class="h-8 rounded-sm bg-primary text-primary-foreground">3</button>
  </div>
  </div>
</div>
