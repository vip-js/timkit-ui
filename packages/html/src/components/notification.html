<div data-slot="notification" data-state="open" role="status" class="bg-background border-border relative flex w-full flex-col gap-1 rounded-lg border p-4 shadow-lg">
  <div class="flex gap-3">
    <div data-slot="notification-icon" aria-hidden="true" class="shrink-0">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9" />
      </svg>
    </div>
    <div class="flex flex-col gap-2">
      <p data-slot="notification-title" class="text-sm font-medium">Notification title</p>
      <p data-slot="notification-description" class="text-muted-foreground text-sm">
        This is a notification description.
      </p>
      <div data-slot="notification-actions" class="flex items-center gap-2">
        <button type="button" class="text-sm font-medium">Action</button>
        <button type="button" class="text-sm font-medium">Dismiss</button>
      </div>
    </div>
  </div>
  <button type="button" data-slot="notification-close" aria-label="Close"><span aria-hidden="true">×</span></button>
</div>
