name: Release @timui/react

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver)"
        required: true
  push:
    tags:
      - "react-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @timui/react run build

      - name: Publish @timui/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter @timui/react publish --access public --no-git-checks

      - name: Tag info
        run: |
          echo "Published version: ${{ github.event.inputs.version || github.ref_name }}"
          echo "npm dist-tag latest"
