name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build registry data
        run: pnpm registry:build:all

      - name: Validate registry coverage
        run: pnpm registry:report

      - name: Goal CI Gate
        run: pnpm goal:ci:full

      - name: Bundle Analyze (Docs)
        run: pnpm --filter @timkit/docs next build --analyze || true
